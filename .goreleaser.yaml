version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/safedep/pmg/internal/version.Version={{.Version}}
      - -X github.com/safedep/pmg/internal/version.Commit={{.Commit}}
    hooks:
      post:
        # The Windows installer. goreleaser runs the hook for every target
        # and the script does nothing for the others. It needs wixl.
        - scripts/msi/build.sh {{ .Os }} {{ .Path }} {{ .Version }} dist/pmg_Windows_x86_64.msi

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
  extra_files:
    - glob: dist/pmg_Windows_x86_64.msi

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256
  extra_files:
    - glob: dist/pmg_Windows_x86_64.msi

universal_binaries:
  - replace: true

homebrew_casks:
  # Channel is derived from the tag's prerelease part (edge.1 -> pmg@edge) so an
  # unexpected prerelease identifier gets its own cask instead of overwriting pmg.
  - name: 'pmg{{ if .Prerelease }}@{{ index (split .Prerelease ".") 0 }}{{ end }}'
    directory: Casks
    homepage: https://github.com/safedep/pmg
    description: "PMG protects developers from malicious packages"
    license: "Apache-2.0"
    binaries:
      - pmg
    # Homebrew 7 deprecates the `postflight` stanza that goreleaser writes from
    # `hooks.post.install`. The block below writes `postflight_steps` instead.
    # goreleaser runs a template pass over the rendered cask, so the quoted form
    # is what emits Homebrew's own `{{staged_path}}` token. Move this to
    # `hooks.post.install_steps` when goreleaser/goreleaser#6873 ships.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/pmg"], must_succeed: false
        end
      end
    repository:
      owner: safedep
      name: homebrew-tap
      branch: main


