# --- enforce: eBPF enforcement for the persistent proxy (docs/persistent-proxy.md, "Kernel enforcement") ---
# Scripts skip unless the host runs as root with kernel BTF and cgroup v2.
# preflight/unsupported-platform is the exception: it runs on macOS and
# Windows and skips on Linux.
