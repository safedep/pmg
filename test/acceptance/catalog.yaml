# Guarantee inventory for the PMG acceptance suite. One entry per guarantee.
# coverage is derived (a script whose path-id matches => covered), never authored.
#
# category is one of:
#   npm|pnpm|bun|yarn|npx|pnpx|pip|pip3|uv|poetry|pipx|uvx|go|proxy|setup|sandbox|cloud|config|version|audit
# The category is also the first path segment of the script id.
# tier is P0 (incident) | P1 (important) | P2 (tracked). Tier is metadata in Part 1;
# it records the Part 2 gate policy and gates nothing yet.
# labels are free-form tags. A run can filter by category and by labels (see README).

# --- covered by seed scripts ---
- id: npm/guard/malware-block
  title: "npm install of a known-malicious package is blocked"
  category: npm
  tier: P0
  guarantee: "A package with a malware verdict is never installed; pmg exits non-zero."
  labels: [malware, block, community]
- id: npm/install/clean-allow
  title: "npm install of a clean package succeeds"
  category: npm
  tier: P1
  guarantee: "A clean package passes analysis, installs, and pmg exits zero."
  labels: [clean, install]
- id: pip/install/clean-allow
  title: "pip install of a clean package succeeds"
  category: pip
  tier: P1
  guarantee: "A clean package passes analysis, installs, and pmg exits zero."
  labels: [clean, install]
- id: setup/install/shims-created
  title: "pmg setup install creates package-manager shims"
  category: setup
  tier: P1
  guarantee: "pmg setup install provisions shims for supported package managers."
  labels: [shims, offline]
- id: cloud/analyzer/authenticated-query-blocks-malware
  title: "authenticated (cloud-mode) query blocks known malware"
  category: cloud
  tier: P0
  guarantee: "With SafeDep Cloud creds, the authenticated api.safedep.io path still blocks malware."
  labels: [malware, block, cloud, authenticated]

# --- gaps across the full user-facing surface (no script yet; tracked, reported, non-blocking) ---

# npm ecosystem
# open finding: pnpm add analyzes the package but does not block it, and poetry
# add installs it with no analysis line. npm, bun, pip, pip3, uv, and pipx block
# the same fixture. These two stay gaps until pmg blocks a direct add.
- id: pnpm/guard/malware-block
  title: "pnpm add of a known-malicious package is blocked"
  category: pnpm
  tier: P0
  guarantee: "A package with a malware verdict is never installed; pmg exits non-zero."
