PackageName: pmg
PackageUrl: https://github.com/safedep/pmg
License: Apache-2.0
LicenseUrl: https://github.com/safedep/pmg/blob/main/LICENSE
ShortDescription: Package Manager Guard protects developers from malicious packages
Description: |-
  PMG (Package Manager Guard) checks packages for malware before npm, pnpm, yarn, bun, pip and uv install them. The check runs before the package code executes. PMG is free and open source. It needs no account and no API key.
  This package installs pmg for every user of the machine. It puts shims for the package managers first on the machine PATH. A plain npm install then goes through PMG. Uninstall removes all of it.
  Open a new terminal after the install. Then run "pmg setup doctor" to check the setup.
Moniker: pmg
Tags:
- malware
- npm
- pypi
