PackageIdentifier: SafeDep.pmg
PackageVersion: {{VERSION}}
PackageLocale: en-US
Publisher: SafeDep
PublisherUrl: https://safedep.io
PublisherSupportUrl: https://github.com/safedep/pmg/issues
Author: SafeDep
PackageName: pmg
PackageUrl: https://github.com/safedep/pmg
License: Apache-2.0
LicenseUrl: https://github.com/safedep/pmg/blob/main/LICENSE
ShortDescription: Package Manager Guard protects developers from malicious packages
Description: |-
  PMG (Package Manager Guard) checks packages for malware before npm, pnpm, yarn, bun, pip and uv install them.
  This package installs pmg for every user of the machine and puts its shims first on the machine PATH. Uninstall removes all of it.
Moniker: pmg
Tags:
- malware
- npm
- pypi
- security
- supply-chain
ReleaseNotesUrl: https://github.com/safedep/pmg/releases/tag/v{{VERSION}}
Documentations:
- DocumentLabel: System install
  DocumentUrl: https://github.com/safedep/pmg/blob/main/docs/system-install.md
