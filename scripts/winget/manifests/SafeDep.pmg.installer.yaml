# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: SafeDep.pmg
PackageVersion: {{VERSION}}
InstallerType: msi
Scope: machine
InstallModes:
- silent
- silentWithProgress
UpgradeBehavior: install
ElevationRequirement: elevationRequired
ReleaseDate: {{RELEASE_DATE}}
# The MSI upgrade code. It is fixed in scripts/msi/pmg.wxs for the life of
# the product, so winget finds an installed pmg of any version. It also finds
# an install that came from the MSI itself.
AppsAndFeaturesEntries:
- Publisher: SafeDep
  UpgradeCode: '{{UPGRADE_CODE}}'
  InstallerType: msi
Installers:
- Architecture: x64
  InstallerUrl: {{MSI_URL}}
  InstallerSha256: {{MSI_SHA256}}
  ProductCode: '{{PRODUCT_CODE}}'
ManifestType: installer
ManifestVersion: 1.6.0
