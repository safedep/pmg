# vet policy v2. The vet GitHub Action reads this file at the base commit
# of each pull request. vet policy schema get prints the fields that a rule
# reads.
#
# The action fails the check on an attack (fail-on: attacks): malware, an
# impostor commit or a suspicious command. This policy also fails the check
# on each critical or high finding that the pull request adds. A malware
# finding is critical and a suspicious package is high, so this rule also
# fails on them. The dependency-cooldown control reports a version that the
# registry published less than 2 days ago as high, so this rule fails on it.
version: 2

rules:
  - id: critical-or-high
    description: A critical or high finding fails the gate.
    when: finding.severity in ["critical", "high"]
    action: fail

# A suppression hides findings from the gate. The findings stay in the
# report. Set id, purl or control, a reason, and an optional expiry.
suppressions:
  - purl: pkg:golang/buf.build/gen/go/safedep/*
    control: dependency-cooldown
    reason: SafeDep publishes these API SDKs. A new SDK version is not a cooldown risk.
#  - purl: pkg:golang/example.com/module@v1.2.3
#    control: vulnerability
#    reason: Reviewed. The code does not call the affected function.
#    expires: 2026-12-31
