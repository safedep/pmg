# Throwaway: stands in for the customer's parent pool. PMG exempts its binary,
# so its connections to GitHub do not pass PMG, as off the pod.
http_port 127.0.0.1:3129
acl localhost src 127.0.0.1/32
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow localhost
http_access deny all
cache deny all
pid_filename /run/squid-parent.pid
access_log stdio:/var/log/squid/parent-access.log
cache_log /var/log/squid/parent-cache.log
