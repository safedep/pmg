# Throwaway: the customer's Squid. GitHub goes to the parent pool, the rest direct.
http_port 3128
acl localnet src 127.0.0.0/8 ::1 172.16.0.0/12 10.0.0.0/8
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow localnet
http_access deny all
acl github dstdomain .github.com .githubusercontent.com
cache_peer 127.0.0.1 parent 3129 0 no-query no-digest default name=ghpool
cache_peer_access ghpool allow github
cache_peer_access ghpool deny all
never_direct allow github
always_direct allow !github
cache deny all
pid_filename /run/squid-runner.pid
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
