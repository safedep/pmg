name: Action E2E

on:
  pull_request:
    branches: [main]
    paths:
      - action.yml
      - action/**
      - cmd/proxy/**
      - internal/ghasummary/**
      - sandbox/profiles/github-actions.yml
      - docs/github-action.md
      - .github/actions/stage-pmg-build/**
      - .github/actions/check-proxy-env-post/**
      - .github/scripts/action-post.sh
      - .github/workflows/action-e2e.yml
  push:
    branches: [main]
    paths:
      - action.yml
      - action/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  default-config:
    name: Default config enforces and protects (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Under enforcement Node trusts the system store from 22.19 on. The
        # action sets NODE_EXTRA_CA_CERTS, so an older Node works too.
        node: [20, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - id: stage
        uses: $/.github/actions/stage-pmg-build
      - uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          version: ${{ steps.stage.outputs.version }}
          cache: true
      - name: The defaults start the proxy with kernel enforcement
        run: |
          set -euo pipefail
          test -n "$PMG_PROXY_STATE"
          test "$NODE_EXTRA_CA_CERTS" = "$PMG_CA_BUNDLE"
          sudo "$PMG_BIN" proxy status --state "$PMG_PROXY_STATE" | tee status.txt
          grep -q "Kernel enforcement: active" status.txt
      - name: Install a benign package
        run: |
          set -euo pipefail
          mkdir t && cd t
          npm init -y
          npm install express@5.2.1
          test -d node_modules/express
      - name: Block a known-malicious package
        run: |
          set -euo pipefail
          mkdir m && cd m
          npm init -y
          if npm --prefer-online --no-cache i safedep-test-pkg@0.1.3; then
            echo "::error::Expected install to fail (malicious package), but it succeeded." >&2
            exit 1
          fi
      - name: The post step exits 1 and its summary names the block
        run: |
          set -euo pipefail
          .github/scripts/action-post.sh 1 "STATE_bin=${PMG_BIN}" STATE_enforce=true "STATE_state=${PMG_PROXY_STATE}" | tee post.log
          grep -Eq '[0-9]+ package\(s\) were blocked by the proxy' post.log

  custom-config-file:
    name: config-file input overrides defaults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Write custom PMG config
        run: |
          cat > pmg.yml <<'YAML'
          paranoid: true
          dependency_cooldown:
            enabled: true
            days: 365
          YAML
      - uses: $/
        with:
          config-file: pmg.yml
      - name: Verify config staged into PMG config dir
        run: |
          set -e
          dest="${XDG_CONFIG_HOME:-$HOME/.config}/safedep/pmg/config.yml"
          test -f "$dest"
          grep -q "^paranoid: true" "$dest"
          grep -q "days: 365" "$dest"
      - name: Verify env doesn't shadow file-based tuning
        shell: bash
        run: |
          # With no explicit "paranoid" input, the action must not export
          # PMG_PARANOID — otherwise it would override the staged config.
          if [ -n "${PMG_PARANOID:-}" ]; then
            echo "::error::PMG_PARANOID leaked into env ($PMG_PARANOID); would shadow config-file" >&2
            exit 1
          fi

  sandbox-setup:
    name: Sandbox setup (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        driver: [landlock, bubblewrap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: $/
        with:
          sandbox: "true"
          sandbox-driver: ${{ matrix.driver }}
      - name: Sandbox env vars propagated
        shell: bash
        run: |
          set -e
          test "$PMG_SANDBOX_ENABLED" = "true"
          test "$PMG_SANDBOX_DRIVER" = "${{ matrix.driver }}"
          pmg version
      - name: Bubblewrap binary installed when driver=bubblewrap
        if: matrix.driver == 'bubblewrap'
        run: bwrap --version
      - name: AppArmor user-ns restriction relaxed
        shell: bash
        run: |
          # systemctl-stop is best-effort; just confirm the sysctl is now 0
          # so unprivileged user namespaces work for either driver.
          v=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo "missing")
          echo "apparmor_restrict_unprivileged_userns=$v"
          test "$v" = "0" -o "$v" = "missing"

  enforce-flags:
    name: enforce-* inputs become flags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lists with commas, newlines and blanks
        env:
          INPUT_ENFORCE_PORTS: "8443, 9443"
          INPUT_ENFORCE_EXEMPT_USERS: ""
          INPUT_ENFORCE_EXEMPT_EXECUTABLES: |
            /opt/agent/bin/agent
            /opt/agent/bin/worker-*
          INPUT_ENFORCE_SKIP_DESTINATIONS: "10.20.0.0/16,"
          INPUT_NETWORK_PROFILE: .pmg/profiles/ci.yml
          INPUT_NETWORK_MODE: enforce
        run: |
          set -euo pipefail
          got="$(action/enforce-flags.sh | tr '\n' ' ')"
          want="--enforce-port 8443 --enforce-port 9443 --enforce-exempt-executable /opt/agent/bin/agent --enforce-exempt-executable /opt/agent/bin/worker-* --enforce-skip-destination 10.20.0.0/16 --profile .pmg/profiles/ci.yml --network-mode enforce "
          test "$got" = "$want" || { echo "got:  $got"; echo "want: $want"; exit 1; }
      - name: No inputs give no flags
        run: |
          set -euo pipefail
          test -z "$(action/enforce-flags.sh)"
      - name: The action library reads the runner files
        run: node --test action/lib.test.js action/main.test.js action/post.test.js

  # The jobs below run the action against a build of this pull request, so
  # the post step uses the stop report and the job summary. Each job runs the
  # post step once by hand to check its exit status and its summary. The post
  # step at the end of the job then finds no proxy and passes.
  post-step-fails-on-block:
    name: The post step fails the job on a blocked package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stage
        uses: $/.github/actions/stage-pmg-build
      - id: pmg
        uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          version: ${{ steps.stage.outputs.version }}
          cache: true
          server-mode: true
          enforce: false
      - name: A malicious install is blocked
        run: |
          set -euo pipefail
          mkdir mal && cd mal
          npm init -y >/dev/null
          if npm --no-cache --prefer-online install safedep-test-pkg@0.1.3; then
            echo "::error::The malicious install succeeded." >&2
            exit 1
          fi
      - name: The post step exits 1 and its summary names the block
        env:
          BIN_DIR: ${{ steps.pmg.outputs.bin-dir }}
        run: |
          set -euo pipefail
          .github/scripts/action-post.sh 1 "STATE_bin=${BIN_DIR}/pmg" STATE_proxy_vars=HTTP_PROXY,HTTPS_PROXY | tee post.log
          grep -Eq '\*\*Failed\.\*\* [0-9]+ package\(s\) were blocked by the proxy' post.log
          grep -Eq '::error title=PMG::PMG blocked [0-9]+ package\(s\)' post.log
          grep -q '^HTTPS_PROXY=$' "$GITHUB_ENV"
      - name: A post step that finds the proxy stopped fails the job
        env:
          BIN_DIR: ${{ steps.pmg.outputs.bin-dir }}
        run: |
          set -euo pipefail
          .github/scripts/action-post.sh 1 "STATE_bin=${BIN_DIR}/pmg" | tee post.log
          grep -q 'set `auto-stop: false`' post.log

  second-action-step:
    name: A second action step fails and keeps the proxy of the first
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stage
        uses: $/.github/actions/stage-pmg-build
      - uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          version: ${{ steps.stage.outputs.version }}
          cache: true
      - name: A malicious install is blocked
        run: |
          set -euo pipefail
          mkdir mal && cd mal
          npm init -y >/dev/null
          if npm --no-cache --prefer-online install safedep-test-pkg@0.1.3; then
            echo "::error::The malicious install succeeded." >&2
            exit 1
          fi
      - name: Second action step must exit non-zero
        id: second
        continue-on-error: true
        uses: $/
        with:
          version: ${{ steps.stage.outputs.version }}
          cache: true
      - name: The proxy of the first step still runs and reports the block
        run: |
          set -euo pipefail
          test "${{ steps.second.outcome }}" = "failure"
          sudo "$PMG_BIN" proxy status --state "$PMG_PROXY_STATE" | tee status.txt
          grep -q 'running (pid' status.txt
          .github/scripts/action-post.sh 1 "STATE_bin=${PMG_BIN}" STATE_enforce=true "STATE_state=${PMG_PROXY_STATE}" | tee post.log
          grep -Eq '\*\*Failed\.\*\* [0-9]+ package\(s\) were blocked by the proxy' post.log

  post-step-audit-bootstrap:
    name: The post step proposes a missing network profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stage
        uses: $/.github/actions/stage-pmg-build
      - id: pmg
        uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          version: ${{ steps.stage.outputs.version }}
          cache: true
          network-profile: .pmg/e2e-network.yml
          enforce: false
      - name: The action turned on server mode
        run: test -n "$HTTPS_PROXY"
      - name: A benign install succeeds
        run: |
          set -euo pipefail
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install lodash@4.17.21
          test -d node_modules/lodash
      - name: The post step passes and proposes the profile
        env:
          BIN_DIR: ${{ steps.pmg.outputs.bin-dir }}
        run: |
          set -euo pipefail
          .github/scripts/action-post.sh 0 "STATE_bin=${BIN_DIR}/pmg" "INPUT_NETWORK-PROFILE=.pmg/e2e-network.yml" | tee post.log
          grep -q '\*\*Passed\.\*\*' post.log
          grep -q 'Save the file as `.pmg/e2e-network.yml` and commit it' post.log
          grep -q 'inherits: github-actions' post.log
          grep -q 'registry.npmjs.org:443' post.log
          test ! -e .pmg/e2e-network.yml

  post-step-clears-proxy-variables:
    name: The post step stops the proxy and clears the proxy variables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its post step runs after the post step of the PMG action.
      - uses: $/.github/actions/check-proxy-env-post
      - id: stage
        uses: $/.github/actions/stage-pmg-build
      - uses: $/
        with:
          version: ${{ steps.stage.outputs.version }}
          cache: true
          server-mode: true
          # Without enforcement the job gets the proxy variables that the
          # post step must empty.
          enforce: false
      - name: A benign install succeeds
        run: |
          set -euo pipefail
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install lodash@4.17.21
          test -d node_modules/lodash

  post-step-enforce:
    name: The post step fails on a connection the profile denies under enforce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stage
        uses: $/.github/actions/stage-pmg-build
      - name: Write the network profile
        run: |
          mkdir -p .pmg
          cat > .pmg/e2e-enforce.yml <<'YAML'
          name: e2e-enforce
          inherits: github-actions
          network:
            allow_outbound:
              - registry.npmjs.org:443
            deny_outbound:
              - "*:*"
          YAML
      - uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          version: ${{ steps.stage.outputs.version }}
          cache: true
          server-mode: true
          enforce: true
          network-profile: .pmg/e2e-enforce.yml
          network-mode: enforce
      - name: A benign install succeeds
        run: |
          set -euo pipefail
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install lodash@4.17.21
          test -d node_modules/lodash
      - name: The profile denies a host it does not name
        run: |
          if curl -fsS --max-time 20 -o /dev/null https://pastebin.com/; then
            echo "::error::The connection to pastebin.com succeeded." >&2
            exit 1
          fi
      - name: The post step exits 1 and denies no host of the runner
        run: |
          set -euo pipefail
          .github/scripts/action-post.sh 1 "STATE_bin=${PMG_BIN}" STATE_enforce=true "STATE_state=${PMG_PROXY_STATE}" \
            "INPUT_NETWORK-PROFILE=.pmg/e2e-enforce.yml" | tee post.log
          grep -q '### Denied connections' post.log
          grep -q '::error title=PMG::PMG denied pastebin.com:443' post.log
          # The runner reaches GitHub through the proxy. The github-actions
          # profile must allow each host it reaches. Other system services
          # of the image, such as snapd and apt, can be denied, so the check
          # reads only the runner's own denials.
          if grep '::error title=PMG::PMG denied' post.log | grep 'Runner\.'; then
            echo "::error::The profile denied a host of the runner." >&2
            exit 1
          fi

  runner-storage:
    name: The github-actions profile allows the cache and artifact storage under enforce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stage
        uses: $/.github/actions/stage-pmg-build
      - name: Write the network profile
        run: |
          mkdir -p .pmg
          cat > .pmg/e2e-storage.yml <<'YAML'
          name: e2e-storage
          inherits: github-actions
          YAML
      - uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step
          version: ${{ steps.stage.outputs.version }}
          cache: true
          server-mode: true
          enforce: true
          network-profile: .pmg/e2e-storage.yml
          network-mode: enforce
      - name: Write the test data
        run: |
          mkdir -p storage-data
          echo "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > storage-data/run.txt
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage-data
          key: pmg-e2e-storage-${{ github.run_id }}-${{ github.run_attempt }}
      - run: rm -rf storage-data
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage-data
          key: pmg-e2e-storage-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: The cache restored the test data
        run: grep -qx "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" storage-data/run.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmg-e2e-storage-${{ github.run_attempt }}
          path: storage-data
          retention-days: 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pmg-e2e-storage-${{ github.run_attempt }}
          path: downloaded
      - name: The artifact holds the test data
        run: grep -qx "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" downloaded/run.txt
      - name: The proxy denied no storage host and no host of the runner
        # It runs after a failed cache or artifact step too, so the log names
        # the storage host that the profile denied.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          # The image runs other system services, such as snapd and apt,
          # that the profile can deny. The post step must not fail on them,
          # so the check reads only the storage hosts and the programs of
          # the runner and the actions.
          .github/scripts/action-post.sh 0 "STATE_bin=${PMG_BIN}" STATE_enforce=true "STATE_state=${PMG_PROXY_STATE}" \
            "INPUT_NETWORK-PROFILE=.pmg/e2e-storage.yml" INPUT_FAIL-ON-VIOLATION=false > post.log 2>&1
          cat post.log
          # The overview row has a blocked count only when the proxy stopped
          # with a verified state.
          if ! grep -Eq '^\| [0-9]+ \| enforce \|' post.log; then
            echo "::error::The post step has no verified stop result under enforce." >&2
            exit 1
          fi
          if ! grep -Eq '^\| `productionresultssa[0-9]+\.blob\.core\.windows\.net:443` .*\| parent rule' post.log; then
            echo "::error::The proxy saw no traffic to a GitHub storage account." >&2
            exit 1
          fi
          if grep -E '^\| `[^`]*blob\.core\.windows\.net:443`' post.log | grep -v '| parent rule'; then
            echo "::error::A storage host is not in the github-actions profile." >&2
            exit 1
          fi
          # Only the Program column names the client. A destination such as
          # deb.nodesource.com must not match.
          if sed -n '/^### Denied connections/,/^### /p' post.log | grep -E '^\| `' \
              | awk -F'|' '$4 ~ /Runner\.|\/node *$/ { print; found = 1 } END { exit !found }'; then
            echo "::error::The profile denied a host of the runner or of an action." >&2
            exit 1
          fi

  job-container-loopback:
    name: Server mode in a job container keeps the loopback bind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24
      # PMG v0.30.0 and older hang on proxy stop when PID 1 does not reap the
      # daemon (#510). An init process reaps it.
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          server-mode: true
      - name: The proxy listens on loopback
        run: |
          set -euo pipefail
          case "$HTTPS_PROXY" in
            http://127.0.0.1:*) ;;
            *) echo "::error::Expected a loopback proxy, got ${HTTPS_PROXY}" >&2; exit 1 ;;
          esac
      - name: A benign install succeeds
        run: |
          set -euo pipefail
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install lodash@4.17.21
          test -d node_modules/lodash
      - name: A malicious install is blocked
        run: |
          set -euo pipefail
          mkdir mal && cd mal
          npm init -y >/dev/null
          if npm --no-cache --prefer-online install safedep-test-pkg@0.1.3; then
            echo "::error::The malicious install succeeded." >&2
            exit 1
          fi
      - name: Stop reports the block
        run: |
          set +e
          out="$(pmg proxy stop --fail-on-violation 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "were blocked" <<<"$out"

  job-container-expose:
    name: Docker actions reach the proxy with expose-to-job-network
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24
      # PMG v0.30.0 and older hang on proxy stop when PID 1 does not reap the
      # daemon (#510). An init process reaps it.
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          server-mode: true
          expose-to-job-network: true
      - name: The proxy listens on the job container address
        run: |
          set -euo pipefail
          read -r hostname < /proc/sys/kernel/hostname
          addr="$(getent ahostsv4 "$hostname" | awk 'NR == 1 { print $1 }')"
          echo "job container address: ${addr}, HTTPS_PROXY: ${HTTPS_PROXY}"
          case "$HTTPS_PROXY" in
            "http://${addr}:"*) ;;
            *) echo "::error::Expected the proxy on ${addr}, got ${HTTPS_PROXY}" >&2; exit 1 ;;
          esac
          case "$NODE_EXTRA_CA_CERTS" in
            /github/home/*) ;;
            *) echo "::error::Expected the CA under /github/home, got ${NODE_EXTRA_CA_CERTS}" >&2; exit 1 ;;
          esac
      - name: A benign install in the job container succeeds
        run: |
          set -euo pipefail
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install lodash@4.17.21
          test -d node_modules/lodash
      - name: Write the check that runs in the Docker actions
        run: |
          cat > pmg-docker-check.sh <<'EOF'
          set -euo pipefail
          case "$HTTPS_PROXY" in
            http://127.0.0.1:*|"") echo "::error::No reachable proxy in the Docker action: '${HTTPS_PROXY}'" >&2; exit 1 ;;
          esac
          test -r "$NODE_EXTRA_CA_CERTS"
          cd "$(mktemp -d)"
          case "$1" in
            npm)
              npm init -y >/dev/null
              npm install lodash@4.17.21
              test -d node_modules/lodash
              malicious=(npm --no-cache --prefer-online install safedep-test-pkg@0.1.3)
              ;;
            pip)
              python -m venv venv
              . venv/bin/activate
              pip install --no-cache-dir six
              malicious=(pip install --no-cache-dir safedep-test-pkg)
              ;;
          esac
          set +e
          out="$("${malicious[@]}" 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::The malicious $1 install succeeded in the Docker action." >&2
            exit 1
          fi
          # The proxy answers a block with 403. Any other failure is not a block.
          grep -q 403 <<<"$out"
          EOF
      - name: npm in a Docker action goes through the proxy
        uses: docker://node:24@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
        with:
          entrypoint: bash
          args: /github/workspace/pmg-docker-check.sh npm
      - name: pip in a Docker action goes through the proxy
        uses: docker://python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        with:
          entrypoint: bash
          args: /github/workspace/pmg-docker-check.sh pip
      - name: Stop reports the blocks from the Docker actions
        run: |
          set +e
          out="$(pmg proxy stop --fail-on-violation 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "were blocked" <<<"$out"

  alpine-shim:
    name: Shim mode in an Alpine job container with no bash or curl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24-alpine
      options: --init
    defaults:
      run:
        shell: sh
    steps:
      # The action needs only sh and the busybox userland, with wget.
      # The job fails here if the image ever gains bash or curl.
      - name: The image has no bash and no curl
        run: |
          set -eu
          grep -q '^ID=alpine' /etc/os-release
          if command -v bash >/dev/null 2>&1; then echo "::error::The image has bash." >&2; exit 1; fi
          if command -v curl >/dev/null 2>&1; then echo "::error::The image has curl." >&2; exit 1; fi
          command -v wget
      # The image has no git, so checkout downloads the repository through
      # the REST API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          server-mode: false
      - name: npm resolves to the PMG shim
        run: |
          set -eu
          pmg version
          npm_path="$(command -v npm)"
          case "$npm_path" in
            "${XDG_DATA_HOME:-$HOME/.local/share}/safedep/pmg/bin/npm"|"$HOME/.pmg/bin/npm") ;;
            *) echo "::error::npm resolved outside the PMG shim dirs: $npm_path" >&2; exit 1 ;;
          esac
      - name: A benign install succeeds
        run: |
          set -eu
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install express@5.2.1
          test -d node_modules/express
      - name: A malicious install is blocked
        run: |
          set -eu
          mkdir mal && cd mal
          npm init -y >/dev/null
          if npm --prefer-online --no-cache i safedep-test-pkg@0.1.3 >out.log 2>&1; then
            cat out.log
            echo "::error::The malicious install succeeded." >&2
            exit 1
          fi
          cat out.log
          grep -qi "Malicious package blocked" out.log

  alpine-server:
    name: Server mode in an Alpine job container with no bash or curl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24-alpine
      options: --init
    defaults:
      run:
        shell: sh
    steps:
      # The action needs only sh and the busybox userland, with wget.
      # The job fails here if the image ever gains bash or curl.
      - name: The image has no bash and no curl
        run: |
          set -eu
          grep -q '^ID=alpine' /etc/os-release
          if command -v bash >/dev/null 2>&1; then echo "::error::The image has bash." >&2; exit 1; fi
          if command -v curl >/dev/null 2>&1; then echo "::error::The image has curl." >&2; exit 1; fi
          command -v wget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          server-mode: true
      - name: The proxy listens on loopback
        run: |
          set -eu
          case "$HTTPS_PROXY" in
            http://127.0.0.1:*) ;;
            *) echo "::error::Expected a loopback proxy, got ${HTTPS_PROXY}" >&2; exit 1 ;;
          esac
      - name: A benign install succeeds
        run: |
          set -eu
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install lodash@4.17.21
          test -d node_modules/lodash
      - name: A malicious install is blocked
        run: |
          set -eu
          mkdir mal && cd mal
          npm init -y >/dev/null
          if npm --no-cache --prefer-online install safedep-test-pkg@0.1.3; then
            echo "::error::The malicious install succeeded." >&2
            exit 1
          fi
      - name: Stop reports the block
        run: |
          set +e
          out="$(pmg proxy stop --fail-on-violation 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          test "$code" -ne 0
          printf '%s\n' "$out" | grep -q "were blocked"

  # The node jobs install the latest release. These install a pinned
  # release, so both download paths run with wget only.
  alpine-golang:
    name: ${{ matrix.mode }} mode in a golang Alpine job container with no bash or curl
    strategy:
      fail-fast: false
      matrix:
        mode: [shim, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: golang:1.26-alpine
      options: --init
    defaults:
      run:
        shell: sh
    steps:
      # The action needs only sh and the busybox userland, with wget.
      # The job fails here if the image ever gains bash or curl.
      - name: The image has no bash and no curl
        run: |
          set -eu
          grep -q '^ID=alpine' /etc/os-release
          if command -v bash >/dev/null 2>&1; then echo "::error::The image has bash." >&2; exit 1; fi
          if command -v curl >/dev/null 2>&1; then echo "::error::The image has curl." >&2; exit 1; fi
          command -v wget
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/
        with:
          auto-stop: false   # a step of this job runs the post step or stops PMG
          version: v0.32.0
          server-mode: ${{ matrix.mode == 'server' }}
      - name: The pinned release runs
        run: pmg version | grep -q '0\.32\.0'
      # go is not a shim. In shim mode PMG runs go itself. In server mode go
      # reads HTTPS_PROXY and SSL_CERT_FILE from the job env.
      - name: A Go module download goes through PMG
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -eu
          # Outside the checkout, so go does not read the go.work of this repo.
          cd "$(mktemp -d)"
          go mod init example.com/pmg-alpine
          if [ "$MODE" = shim ]; then
            pmg go get github.com/google/uuid@v1.6.0
          else
            case "$HTTPS_PROXY" in
              http://127.0.0.1:*) ;;
              *) echo "::error::Expected a loopback proxy, got ${HTTPS_PROXY:-nothing}" >&2; exit 1 ;;
            esac
            go get github.com/google/uuid@v1.6.0
          fi
          grep -q 'github.com/google/uuid v1.6.0' go.mod
      - name: Stop reports no block
        if: matrix.mode == 'server'
        run: pmg proxy stop --fail-on-violation

  # Upstream busybox wget, as in the busybox image, does not verify TLS
  # certificates. It prints the note below and goes on. The stand-in prints
  # the same note in front of the Alpine wget, so the job does not depend on
  # a busybox image that can run actions/checkout.
  alpine-unverified-wget:
    name: Refuse a wget that does not verify TLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24-alpine
      options: --init
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put a wget that prints the busybox note first on PATH
        run: |
          set -eu
          if command -v curl >/dev/null 2>&1; then echo "::error::The image has curl." >&2; exit 1; fi
          real="$(command -v wget)"
          dir="$RUNNER_TEMP/unverified-wget"
          mkdir -p "$dir"
          printf '%s\n' '#!/bin/sh' \
            'echo "wget: note: TLS certificate validation not implemented" >&2' \
            "exec $real \"\$@\"" > "$dir/wget"
          chmod +x "$dir/wget"
          cat "$dir/wget"
          printf '%s\n' "$dir" >> "$GITHUB_PATH"
      - name: Action must exit non-zero
        id: run
        continue-on-error: true
        uses: $/
      - name: The action failed and installed no PMG
        run: |
          set -eu
          test "${{ steps.run.outcome }}" = "failure"
          if command -v pmg >/dev/null 2>&1; then echo "::error::PMG is on PATH." >&2; exit 1; fi

  expose-needs-job-container:
    name: expose-to-job-network fails without a job container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A service container gives the job a container network but no job
    # container, which the action must not mistake for one.
    services:
      web:
        image: nginx:alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The job has a container network and no job container
        env:
          JOB_CONTAINER_NETWORK: ${{ job.container.network }}
          JOB_CONTAINER_ID: ${{ job.container.id }}
        run: |
          set -euo pipefail
          test -n "$JOB_CONTAINER_NETWORK"
          test -z "$JOB_CONTAINER_ID"
      - name: Action must exit non-zero
        id: run
        continue-on-error: true
        uses: $/
        with:
          server-mode: true
          expose-to-job-network: true
      - name: The action failed and started no proxy
        run: |
          set -euo pipefail
          test "${{ steps.run.outcome }}" = "failure"
          pmg proxy status | tee status.txt
          grep -q "not running" status.txt

  enforce-input-typo:
    name: A typo in the enforce policy fails the action under enforce auto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stage
        uses: $/.github/actions/stage-pmg-build
      - name: Action must exit non-zero
        id: run
        continue-on-error: true
        uses: $/
        with:
          version: ${{ steps.stage.outputs.version }}
          cache: true
          enforce-skip-destinations: 10.0.0.0/33
      - name: The action failed and no proxy runs
        run: |
          set -euo pipefail
          test "${{ steps.run.outcome }}" = "failure"
          if pgrep -x pmg; then
            echo "::error::A PMG proxy runs after the failed start." >&2
            exit 1
          fi
      - name: Write a config file with a typo in the enforce section
        run: |
          cat > pmg-typo.yml <<'YAML'
          proxy:
            server:
              enforce:
                skip_destinations:
                  - 10.0.0.0/33
          YAML
      - name: Action with the config file must exit non-zero
        id: config
        continue-on-error: true
        uses: $/
        with:
          version: ${{ steps.stage.outputs.version }}
          cache: true
          config-file: pmg-typo.yml
      - name: The action failed on the config file and no proxy runs
        run: |
          set -euo pipefail
          test "${{ steps.config.outcome }}" = "failure"
          if pgrep -x pmg; then
            echo "::error::A PMG proxy runs after the failed start." >&2
            exit 1
          fi

  non-linux-fail-fast:
    name: Action fails fast on non-Linux runners
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Action must exit non-zero
        id: run
        continue-on-error: true
        uses: $/
      - name: Verify it failed
        shell: bash
        run: |
          test "${{ steps.run.outcome }}" = "failure"
