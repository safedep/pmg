name: Action E2E

on:
  pull_request:
    branches: [main]
    paths:
      - action.yml
      - docs/github-action.md
      - .github/workflows/action-e2e.yml
  push:
    branches: [main]
    paths:
      - action.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  default-config:
    name: Default config installs and protects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: ./
      - name: PATH wiring
        run: |
          set -e
          which pmg
          which npm
          # Either layout is valid here: the action installs a published
          # release, which may predate the XDG shim directory.
          npm_path="$(command -v npm)"
          case "$npm_path" in
            "${XDG_DATA_HOME:-$HOME/.local/share}/safedep/pmg/bin/npm"|"$HOME/.pmg/bin/npm") ;;
            *) echo "npm resolved outside the PMG shim dirs: $npm_path"; exit 1 ;;
          esac
      - name: Install a benign package
        run: |
          mkdir t && cd t
          npm init -y
          npm install express@5.2.1
          test -d node_modules/express
      - name: Block a known-malicious package
        shell: bash
        run: |
          set -eo pipefail
          mkdir m && cd m
          npm init -y
          set +e
          npm --prefer-online --no-cache i safedep-test-pkg@0.1.3 >out.log 2>&1
          code=$?
          set -e
          cat out.log
          if [ "$code" -eq 0 ]; then
            echo "::error::Expected install to fail (malicious package), but it succeeded." >&2
            exit 1
          fi
          grep -qi "Malicious package blocked" out.log

  custom-config-file:
    name: config-file input overrides defaults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Write custom PMG config
        run: |
          cat > pmg.yml <<'YAML'
          paranoid: true
          dependency_cooldown:
            enabled: true
            days: 365
          YAML
      - uses: ./
        with:
          config-file: pmg.yml
      - name: Verify config staged into PMG config dir
        run: |
          set -e
          dest="${XDG_CONFIG_HOME:-$HOME/.config}/safedep/pmg/config.yml"
          test -f "$dest"
          grep -q "^paranoid: true" "$dest"
          grep -q "days: 365" "$dest"
      - name: Verify env doesn't shadow file-based tuning
        shell: bash
        run: |
          # With no explicit "paranoid" input, the action must not export
          # PMG_PARANOID — otherwise it would override the staged config.
          if [ -n "${PMG_PARANOID:-}" ]; then
            echo "::error::PMG_PARANOID leaked into env ($PMG_PARANOID); would shadow config-file" >&2
            exit 1
          fi

  sandbox-setup:
    name: Sandbox setup (${{ matrix.driver }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        driver: [landlock, bubblewrap]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: ./
        with:
          sandbox: "true"
          sandbox-driver: ${{ matrix.driver }}
      - name: Sandbox env vars propagated
        shell: bash
        run: |
          set -e
          test "$PMG_SANDBOX_ENABLED" = "true"
          test "$PMG_SANDBOX_DRIVER" = "${{ matrix.driver }}"
          pmg version
      - name: Bubblewrap binary installed when driver=bubblewrap
        if: matrix.driver == 'bubblewrap'
        run: bwrap --version
      - name: AppArmor user-ns restriction relaxed
        shell: bash
        run: |
          # systemctl-stop is best-effort; just confirm the sysctl is now 0
          # so unprivileged user namespaces work for either driver.
          v=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo "missing")
          echo "apparmor_restrict_unprivileged_userns=$v"
          test "$v" = "0" -o "$v" = "missing"

  enforce-flags:
    name: enforce-* inputs become flags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lists with commas, newlines and blanks
        env:
          INPUT_ENFORCE_PORTS: "8443, 9443"
          INPUT_ENFORCE_EXEMPT_USERS: ""
          INPUT_ENFORCE_EXEMPT_EXECUTABLES: |
            /opt/agent/bin/agent
            /opt/agent/bin/worker-*
          INPUT_ENFORCE_SKIP_DESTINATIONS: "10.20.0.0/16,"
        run: |
          set -euo pipefail
          got="$(.github/scripts/enforce-flags.sh | tr '\n' ' ')"
          want="--enforce-port 8443 --enforce-port 9443 --enforce-exempt-executable /opt/agent/bin/agent --enforce-exempt-executable /opt/agent/bin/worker-* --enforce-skip-destination 10.20.0.0/16 "
          test "$got" = "$want" || { echo "got:  $got"; echo "want: $want"; exit 1; }
      - name: No inputs give no flags
        run: |
          set -euo pipefail
          test -z "$(.github/scripts/enforce-flags.sh)"

  job-container-loopback:
    name: Server mode in a job container keeps the loopback bind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24
      # PMG v0.30.0 and older hang on proxy stop when PID 1 does not reap the
      # daemon (#510). An init process reaps it.
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./
        with:
          server-mode: true
      - name: The proxy listens on loopback
        run: |
          set -euo pipefail
          case "$HTTPS_PROXY" in
            http://127.0.0.1:*) ;;
            *) echo "::error::Expected a loopback proxy, got ${HTTPS_PROXY}" >&2; exit 1 ;;
          esac
      - name: A benign install succeeds
        run: |
          set -euo pipefail
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install lodash@4.17.21
          test -d node_modules/lodash
      - name: A malicious install is blocked
        run: |
          set -euo pipefail
          mkdir mal && cd mal
          npm init -y >/dev/null
          if npm --no-cache --prefer-online install safedep-test-pkg@0.1.3; then
            echo "::error::The malicious install succeeded." >&2
            exit 1
          fi
      - name: Stop reports the block
        run: |
          set +e
          out="$(pmg proxy stop --fail-on-violation 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "were blocked" <<<"$out"

  job-container-expose:
    name: Docker actions reach the proxy with expose-to-job-network
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24
      # PMG v0.30.0 and older hang on proxy stop when PID 1 does not reap the
      # daemon (#510). An init process reaps it.
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./
        with:
          server-mode: true
          expose-to-job-network: true
      - name: The proxy listens on the job container address
        run: |
          set -euo pipefail
          read -r hostname < /proc/sys/kernel/hostname
          addr="$(getent ahostsv4 "$hostname" | awk 'NR == 1 { print $1 }')"
          echo "job container address: ${addr}, HTTPS_PROXY: ${HTTPS_PROXY}"
          case "$HTTPS_PROXY" in
            "http://${addr}:"*) ;;
            *) echo "::error::Expected the proxy on ${addr}, got ${HTTPS_PROXY}" >&2; exit 1 ;;
          esac
          case "$NODE_EXTRA_CA_CERTS" in
            /github/home/*) ;;
            *) echo "::error::Expected the CA under /github/home, got ${NODE_EXTRA_CA_CERTS}" >&2; exit 1 ;;
          esac
      - name: A benign install in the job container succeeds
        run: |
          set -euo pipefail
          mkdir benign && cd benign
          npm init -y >/dev/null
          npm install lodash@4.17.21
          test -d node_modules/lodash
      - name: Write the check that runs in the Docker actions
        run: |
          cat > pmg-docker-check.sh <<'EOF'
          set -euo pipefail
          case "$HTTPS_PROXY" in
            http://127.0.0.1:*|"") echo "::error::No reachable proxy in the Docker action: '${HTTPS_PROXY}'" >&2; exit 1 ;;
          esac
          test -r "$NODE_EXTRA_CA_CERTS"
          cd "$(mktemp -d)"
          case "$1" in
            npm)
              npm init -y >/dev/null
              npm install lodash@4.17.21
              test -d node_modules/lodash
              malicious=(npm --no-cache --prefer-online install safedep-test-pkg@0.1.3)
              ;;
            pip)
              python -m venv venv
              . venv/bin/activate
              pip install --no-cache-dir six
              malicious=(pip install --no-cache-dir safedep-test-pkg)
              ;;
          esac
          set +e
          out="$("${malicious[@]}" 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::The malicious $1 install succeeded in the Docker action." >&2
            exit 1
          fi
          # The proxy answers a block with 403. Any other failure is not a block.
          grep -q 403 <<<"$out"
          EOF
      - name: npm in a Docker action goes through the proxy
        uses: docker://node:24@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
        with:
          entrypoint: bash
          args: /github/workspace/pmg-docker-check.sh npm
      - name: pip in a Docker action goes through the proxy
        uses: docker://python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
        with:
          entrypoint: bash
          args: /github/workspace/pmg-docker-check.sh pip
      - name: Stop reports the blocks from the Docker actions
        run: |
          set +e
          out="$(pmg proxy stop --fail-on-violation 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "were blocked" <<<"$out"

  expose-needs-job-container:
    name: expose-to-job-network fails without a job container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A service container gives the job a container network but no job
    # container, which the action must not mistake for one.
    services:
      web:
        image: nginx:alpine
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: The job has a container network and no job container
        run: |
          set -euo pipefail
          test -n "${{ job.container.network }}"
          test -z "${{ job.container.id }}"
      - name: Action must exit non-zero
        id: run
        continue-on-error: true
        uses: ./
        with:
          server-mode: true
          expose-to-job-network: true
      - name: The action failed and started no proxy
        run: |
          set -euo pipefail
          test "${{ steps.run.outcome }}" = "failure"
          pmg proxy status | tee status.txt
          grep -q "not running" status.txt

  non-linux-fail-fast:
    name: Action fails fast on non-Linux runners
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Action must exit non-zero
        id: run
        continue-on-error: true
        uses: ./
      - name: Verify it failed
        shell: bash
        run: |
          test "${{ steps.run.outcome }}" = "failure"
