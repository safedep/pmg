name: Acceptance Suite

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: triggering ref)"
        required: false
        default: ""
      category:
        description: "Optional category filter, e.g. npm (default: all)"
        required: false
        default: ""
      labels:
        description: "Optional comma-separated label filter, e.g. malware,clean (default: all)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The main job runs every category on each OS. A category that needs a
  # feature the OS lacks skips there: enforce runs only on Linux as root,
  # truststore only in its own job, and sandbox has no driver on Windows.
  acceptance:
    name: Acceptance Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PMG_EXE: ${{ matrix.os == 'windows-latest' && 'pmg.exe' || 'pmg' }}
      SAFEDEP_API_KEY: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
      SAFEDEP_TENANT_ID: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN }}
      PMG_CLOUD_ENABLED: "true"
      # All hosted runners share one stable endpoint. Without this each
      # ephemeral runner registers a new endpoint on every acceptance run.
      PMG_CLOUD_ENDPOINT_ID: "gh:${{ github.repository }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Enable corepack
        run: corepack enable

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup aube
        run: |
          npm install -g --ignore-scripts=false @endevco/aube@2.2.4
          aube --version

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Only the enforce scripts use Poetry, and they run only on Linux.
      - name: Install Poetry
        if: runner.os == 'Linux'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      - name: Install pipx
        run: |
          python -m pip install --upgrade pipx
          pipx --version

      - name: Build PMG
        run: go build -o "bin/${PMG_EXE}" .

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run acceptance suite
        env:
          ACCEPTANCE_CATEGORY: ${{ inputs.category }}
          ACCEPTANCE_LABELS: ${{ inputs.labels }}
        run: |
          export PMG_BIN="${GITHUB_WORKSPACE}/bin/${PMG_EXE}"
          gotestsum --junitfile "${RUNNER_TEMP}/acceptance.xml" --format testname \
            -- -tags acceptance -timeout 20m ./test/acceptance

      - name: Render report
        if: always()
        run: |
          go run ./test/acceptance/report \
            -junit "${RUNNER_TEMP}/acceptance.xml" \
            -catalog test/acceptance/catalog.yaml \
            -scripts test/acceptance/scripts \
            | tee "${RUNNER_TEMP}/acceptance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-report-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acceptance-report.md
            ${{ runner.temp }}/acceptance.xml

  # The sandbox guarantees hold per driver. The main job runs them under
  # Landlock on Linux and under Seatbelt on macOS. This job runs the sandbox
  # category under Bubblewrap on Linux, so a driver-specific gap shows up in CI.
  sandbox-drivers:
    name: Acceptance Suite - sandbox (${{ matrix.driver }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            driver: bubblewrap
    env:
      SAFEDEP_API_KEY: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
      SAFEDEP_TENANT_ID: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN }}
      PMG_CLOUD_ENABLED: "true"
      PMG_CLOUD_ENDPOINT_ID: "gh:${{ github.repository }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Bubblewrap
        if: matrix.driver == 'bubblewrap'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          bwrap --version

      - name: Disable AppArmor for Bubblewrap
        if: matrix.driver == 'bubblewrap'
        run: |
          sudo systemctl stop apparmor
          sudo systemctl disable apparmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build PMG
        run: make

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run sandbox acceptance scripts
        env:
          PMG_BIN: ${{ github.workspace }}/bin/pmg
          PMG_SANDBOX_DRIVER: ${{ matrix.driver == 'bubblewrap' && 'bubblewrap' || '' }}
          ACCEPTANCE_CATEGORY: sandbox
        run: |
          gotestsum --junitfile "${RUNNER_TEMP}/acceptance.xml" --format testname \
            -- -tags acceptance -timeout 15m ./test/acceptance

      - name: Render report
        if: always()
        run: |
          go run ./test/acceptance/report \
            -junit "${RUNNER_TEMP}/acceptance.xml" \
            -catalog test/acceptance/catalog.yaml \
            -scripts test/acceptance/scripts \
            | tee "${RUNNER_TEMP}/acceptance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-report-sandbox-${{ matrix.driver }}
          path: |
            ${{ runner.temp }}/acceptance-report.md
            ${{ runner.temp }}/acceptance.xml

  # The enforce category attaches kernel programs and installs the PMG CA
  # into the system trust store, so it runs as root on its own disposable
  # runner. Every enforce script must pass here.
  enforce:
    name: Acceptance Suite - enforce (root)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      SAFEDEP_API_KEY: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
      SAFEDEP_TENANT_ID: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN }}
      PMG_CLOUD_ENABLED: "true"
      PMG_CLOUD_ENDPOINT_ID: "gh:${{ github.repository }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Enable corepack
        run: corepack enable

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      - name: Build PMG
        run: make

      # The sandbox runs a root caller's command under an unprivileged id in
      # a user namespace. That id cannot enter /home/runner, so a one-shot
      # sandboxed run fails to exec a binary under the workspace. A root
      # install runs pmg from a system path, and so does this job.
      - name: Install PMG for root
        run: sudo install -m 0755 bin/pmg /usr/local/bin/pmg

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # The module download runs as the runner user, so the root step only
      # reads the module cache. A root process that unpacks modules leaves
      # root-owned directories the runner user cannot write to later. Root
      # gets its own build cache for the same reason.
      - name: Download modules
        run: go mod download

      # sudo resets PATH, so the tools the scripts exec travel through
      # --preserve-env.
      - name: Run enforce acceptance scripts as root
        env:
          PMG_BIN: /usr/local/bin/pmg
          ACCEPTANCE_CATEGORY: enforce
          GOCACHE: ${{ runner.temp }}/go-build-root
        run: |
          sudo --preserve-env=PATH,HOME,RUSTUP_HOME,CARGO_HOME,GOPATH,GOMODCACHE,GOCACHE,GOFLAGS,PMG_BIN,ACCEPTANCE_CATEGORY,SAFEDEP_API_KEY,SAFEDEP_TENANT_ID,PMG_CLOUD_ENABLED,PMG_CLOUD_ENDPOINT_ID \
            "$(command -v gotestsum)" --junitfile "${RUNNER_TEMP}/acceptance.xml" --format testname \
            -- -tags acceptance -timeout 20m ./test/acceptance

      - name: Render report
        if: always()
        run: |
          go run ./test/acceptance/report \
            -junit "${RUNNER_TEMP}/acceptance.xml" \
            -catalog test/acceptance/catalog.yaml \
            -scripts test/acceptance/scripts \
            | tee "${RUNNER_TEMP}/acceptance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-report-enforce
          path: |
            ${{ runner.temp }}/acceptance-report.md
            ${{ runner.temp }}/acceptance.xml

  # The truststore category changes the system trust store, so it runs on a
  # disposable runner, one per OS. It runs as the runner user, as a developer
  # does. pmg elevates the trust store write itself: sudo on Linux and macOS,
  # and the elevated runner token on Windows.
  truststore:
    name: Acceptance Suite - truststore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      # No macOS: a change to admin trust settings that exist opens a password
      # dialog, also under sudo, and a runner cannot answer it. Run the scripts
      # by hand on a Mac (test/acceptance/README.md). safedep/pmg#543 tracks it.
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PMG_EXE: ${{ matrix.os == 'windows-latest' && 'pmg.exe' || 'pmg' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build PMG
        run: go build -o "bin/${PMG_EXE}" .

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run truststore acceptance scripts
        env:
          PMG_ACCEPTANCE_TRUSTSTORE: "1"
          ACCEPTANCE_CATEGORY: truststore
        run: |
          export PMG_BIN="${GITHUB_WORKSPACE}/bin/${PMG_EXE}"
          gotestsum --junitfile "${RUNNER_TEMP}/acceptance.xml" --format testname \
            -- -tags acceptance -timeout 15m ./test/acceptance

      - name: Render report
        if: always()
        run: |
          go run ./test/acceptance/report \
            -junit "${RUNNER_TEMP}/acceptance.xml" \
            -catalog test/acceptance/catalog.yaml \
            -scripts test/acceptance/scripts \
            | tee "${RUNNER_TEMP}/acceptance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-report-truststore-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acceptance-report.md
            ${{ runner.temp }}/acceptance.xml
