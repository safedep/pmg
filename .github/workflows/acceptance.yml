name: Acceptance Suite

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: triggering ref)"
        required: false
        default: ""
      category:
        description: "Optional category filter, e.g. npm (default: all)"
        required: false
        default: ""
      labels:
        description: "Optional comma-separated label filter, e.g. malware,clean (default: all)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC, default branch
  # Advisory (non-gating) PR check. The suite runs in well under a minute and
  # guards PMG's real-binary guarantees against regressions. Pure-docs PRs are
  # skipped. Fork PRs have no cloud secrets, so cloud-category cases skip visibly.
  # A red run is a signal, not a merge block: keep this out of required checks so
  # a stale fixture or backend blip never wedges an unrelated PR.
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# One in-flight run per PR (or per branch for other events); a new push cancels
# the superseded PR run.
concurrency:
  group: acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Do not auto-run on fork PRs: the suite runs the real binary and hits prod.
    # Forks get no secrets (cloud cases would skip), and gating their untrusted
    # code behind a maintainer keeps compute and prod calls under our control. A
    # maintainer can still run a fork's ref with workflow_dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      SAFEDEP_API_KEY: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
      SAFEDEP_TENANT_ID: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN }}
      PMG_CLOUD_ENABLED: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Build PMG
        run: make

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run acceptance suite
        # The category and label filters reach the suite only as environment
        # variables read by the Go harness, never interpolated into this script,
        # so a dispatch input cannot inject a shell command or extra test args.
        env:
          PMG_BIN: ${{ github.workspace }}/bin/pmg
          ACCEPTANCE_CATEGORY: ${{ inputs.category }}
          ACCEPTANCE_LABELS: ${{ inputs.labels }}
        run: |
          gotestsum --junitfile "${RUNNER_TEMP}/acceptance.xml" --format testname \
            -- -tags acceptance -timeout 20m ./test/acceptance

      - name: Render report
        if: always()
        run: |
          go run ./test/acceptance/report \
            -junit "${RUNNER_TEMP}/acceptance.xml" \
            -catalog test/acceptance/catalog.yaml \
            -scripts test/acceptance/scripts \
            | tee "${RUNNER_TEMP}/acceptance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-report
          path: |
            ${{ runner.temp }}/acceptance-report.md
            ${{ runner.temp }}/acceptance.xml
