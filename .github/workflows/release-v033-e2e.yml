name: Release check - v0.33.0 through the published action

# Scratch workflow for the v0.33.0 release check. It runs the published
# action refs, as users do, and asserts what the docs promise.

on:
  push:
    branches: [ccr-c7f282e1-5g6hud]
    paths:
      - .github/workflows/release-v033-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1-quickstart:
    name: "@v1 quick start (docs) guards npm"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: safedep/pmg@v1
      - name: Which pmg and which npm
        run: |
          pmg version
          echo "npm resolves to: $(command -v npm)"
          ls -d "$HOME/.pmg/bin" "${XDG_DATA_HOME:-$HOME/.local/share}/safedep/pmg/bin" 2>&1 || true
      - name: A malicious npm install is blocked
        run: |
          mkdir m && cd m && npm init -y >/dev/null
          if npm --prefer-online --no-cache i safedep-test-pkg@0.1.3 > out.log 2>&1; then
            cat out.log
            echo "::error::@v1 did not block the malicious package"
            exit 1
          fi
          cat out.log
          grep -qi "Malicious package blocked" out.log

  shim-mode:
    name: "@v0.33.0 shim mode: npm, pip, cooldown, doctor"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: safedep/pmg@v0.33.0
        id: pmg
      - name: latest resolves to v0.33.0 and shims are first
        run: |
          echo "output version: ${{ steps.pmg.outputs.version }}"
          test "${{ steps.pmg.outputs.version }}" = "v0.33.0"
          pmg version | grep -q "0.33.0"
          for pm in npm npx pip pip3 pnpm yarn uv; do
            p="$(command -v "$pm" || true)"; echo "$pm -> $p"
            case "$p" in */safedep/pmg/bin/*) ;; "") ;; *) echo "::error::$pm is not shimmed"; exit 1 ;; esac
          done
      - name: Benign installs work
        run: |
          mkdir b && cd b && npm init -y >/dev/null
          npm install express@4.21.2
          test -d node_modules/express
          python -m venv /tmp/v && /tmp/v/bin/python -m pip --version
          pip install --no-cache-dir six==1.16.0
      - name: Malicious npm and pip installs are blocked
        run: |
          mkdir m && cd m && npm init -y >/dev/null
          if npm --prefer-online --no-cache i safedep-test-pkg@0.1.3 > npm.log 2>&1; then cat npm.log; exit 1; fi
          cat npm.log; grep -qi "Malicious package blocked" npm.log
          if pip install --no-cache-dir safedep-test-pkg==0.0.4 > pip.log 2>&1; then cat pip.log; exit 1; fi
          cat pip.log; grep -qi "Malicious package blocked" pip.log
      - name: Cooldown blocks a version published today
        run: |
          v=$(curl -fsSL https://registry.npmjs.org/typescript | jq -r '."dist-tags".next')
          t=$(curl -fsSL https://registry.npmjs.org/typescript | jq -r --arg v "$v" '.time[$v]')
          echo "typescript@$v published $t"
          mkdir c && cd c && npm init -y >/dev/null
          if npm install --prefer-online "typescript@$v" > c.log 2>&1; then cat c.log; echo "::error::cooldown did not block"; exit 1; fi
          cat c.log
          grep -qi "cooldown" c.log
      - name: setup doctor passes
        run: pmg setup doctor

  sandbox-landlock:
    name: "@v0.33.0 sandbox (landlock) blocks a credential read"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: safedep/pmg@v0.33.0
        with:
          sandbox: true
      - &sandbox-checks
        name: Sandbox checks
        run: |
          pmg sandbox doctor || echo "::warning::sandbox doctor exited $?"
          echo "~/.npm before the first install: $(ls -d ~/.npm 2>&1)"
          mkdir -p ~/.aws && echo "aws_secret_access_key = CANARYSECRET123" > ~/.aws/credentials
          mkdir -p evil && cat > evil/package.json <<'EOF'
          {"name":"evil-local","version":"1.0.0","scripts":{"postinstall":"cat $HOME/.aws/credentials"}}
          EOF
          mkdir app && cd app && npm init -y >/dev/null
          set +e
          npm install lodash@4.17.21 > first.log 2>&1
          first=$?
          set -e
          cat first.log
          echo "FIRST sandboxed install on a fresh runner exit=$first"
          mkdir -p ~/.npm
          npm install lodash@4.17.21
          test -d node_modules/lodash
          set +e
          npm install --foreground-scripts ../evil > evil.log 2>&1
          code=$?
          set -e
          cat evil.log
          if grep -q CANARYSECRET123 evil.log; then echo "::error::the sandbox let the postinstall read the credentials"; exit 1; fi
          test "$code" -ne 0
          if npm --prefer-online --no-cache i safedep-test-pkg@0.1.3 > m.log 2>&1; then cat m.log; exit 1; fi
          grep -qi "Malicious package blocked" m.log
          if [ "$first" -ne 0 ]; then echo "::error::the first sandboxed npm install failed on a fresh runner"; exit 1; fi

  sandbox-bubblewrap:
    name: "@v0.33.0 sandbox (bubblewrap) blocks a credential read"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: safedep/pmg@v0.33.0
        with:
          sandbox: true
          sandbox-driver: bubblewrap
      - *sandbox-checks

  sandbox-exec:
    name: "@v0.33.0 sandbox exec with a network policy"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # sandbox: true relaxes AppArmor so unprivileged user namespaces work.
      - uses: safedep/pmg@v0.33.0
        with:
          sandbox: true
      - name: exec keeps the program's output and exit code
        run: |
          out="$(pmg sandbox exec -- sh -c 'echo hello; exit 3' 2>/dev/null)" && code=0 || code=$?
          echo "out=$out code=$code"
          test "$out" = "hello"; test "$code" = "3"
      - name: exec blocks a credential read
        run: |
          mkdir -p ~/.aws && echo "CANARYSECRET123" > ~/.aws/credentials
          if pmg sandbox exec -- cat "$HOME/.aws/credentials"; then echo "::error::read allowed"; exit 1; fi
      - name: exec npm install with the default cache
        continue-on-error: true
        run: |
          mkdir -p ~/.npm d && cd d && npm init -y >/dev/null
          pmg sandbox exec -- npm install lodash@4.17.21
      - name: exec enforces an allow list
        env:
          npm_config_cache: ${{ github.workspace }}/.npm-cache
        run: |
          mkdir app && cd app && npm init -y >/dev/null
          pmg sandbox exec --network-mode enforce --network-deny '*:*' --network-allow registry.npmjs.org:443 -- npm install lodash@4.17.21
          test -d node_modules/lodash
          set +e
          pmg sandbox exec --network-mode enforce --network-deny '*:*' --network-allow registry.npmjs.org:443 -- curl -sS -o /dev/null https://pastebin.com/ 2> deny.log
          code=$?
          set -e
          cat deny.log
          test "$code" -ne 0
          grep -qF "Network policy denied pastebin.com:443" deny.log
          pmg sandbox explain --last
      - name: exec refuses a direct connection that ignores the proxy
        run: |
          if pmg sandbox exec -- curl -sS -m 10 --noproxy '*' -o /dev/null https://pastebin.com/; then echo "::error::direct connection went through"; exit 1; fi
      - name: audit run, then propose
        run: |
          pmg sandbox exec -- sh -c 'curl -sS -o /dev/null https://registry.npmjs.org/lodash; curl -sS -o /dev/null https://pypi.org/simple/six/'
          pmg sandbox profile propose --last --new ./agent.yml
          cat agent.yml
          pmg sandbox profile lint ./agent.yml
          pmg sandbox exec --sandbox-profile ./agent.yml --network-mode enforce -- curl -sS -o /dev/null https://pypi.org/simple/six/
          if pmg sandbox exec --sandbox-profile ./agent.yml --network-mode enforce -- curl -sS -o /dev/null https://pastebin.com/; then exit 1; fi

  server-mode:
    name: "@v0.33.0 server mode blocks and stop fails"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
      - name: Installs through the proxy
        run: |
          pmg proxy status
          mkdir b && cd b && npm init -y >/dev/null && npm install lodash@4.17.21
          if npm --prefer-online --no-cache i safedep-test-pkg@0.1.3; then exit 1; fi
          python -m venv v && . v/bin/activate
          if python -m pip install --no-cache-dir safedep-test-pkg==0.0.4; then exit 1; fi
      - name: Stop fails on the blocks
        if: always()
        run: |
          set +e; out="$(pmg proxy stop --fail-on-violation 2>&1)"; code=$?; set -e
          echo "$out"; test "$code" -ne 0; grep -q "were blocked" <<<"$out"

  server-cloud:
    name: "@v0.33.0 server mode with cloud sync"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KEY: ${{ secrets.SAFEDEP_CLOUD_API_KEY != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_KEY == 'true'
        with:
          node-version: 24
      - uses: safedep/pmg@v0.33.0
        if: env.HAS_KEY == 'true'
        with:
          server-mode: true
          api-key: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
          tenant-id: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN }}
      - name: A block syncs to the cloud at stop
        if: env.HAS_KEY == 'true'
        run: |
          mkdir m && cd m && npm init -y >/dev/null
          if npm --prefer-online --no-cache i safedep-test-pkg@0.1.3; then exit 1; fi
          set +e; out="$(pmg proxy stop --fail-on-violation 2>&1)"; code=$?; set -e
          echo "$out"; test "$code" -ne 0
          grep -qE "Synced [0-9]+ event\(s\) to SafeDep Cloud" <<<"$out"
      - name: No credentials
        if: env.HAS_KEY != 'true'
        run: echo "::warning::no cloud credentials, skipped"

  np-advisory-audit:
    name: "@v0.33.0 network-profile, audit (advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - &docs-profile
        name: Write the docs profile
        run: |
          mkdir -p .pmg/profiles
          cat > .pmg/profiles/ci.yml <<'EOF'
          name: ci
          inherits: npm-restrictive
          network:
            deny_ip_literals: true
            allow_outbound:
              # The runner reports the job to GitHub through the proxy.
              - "*.actions.githubusercontent.com:443"
              - "*.githubapp.com:443"
            deny_outbound:
              - pastebin.com:443
          EOF
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          network-profile: .pmg/profiles/ci.yml
      - name: Status, benign install, audit lets the host through
        run: |
          pmg proxy status | tee status.txt
          grep -qF "Network policy: audit, profile npm-restrictive < $GITHUB_WORKSPACE/.pmg/profiles/ci.yml, enforce: off, policy advisory" status.txt
          test -n "$PMG_PROXY_RUN"
          mkdir b && cd b && npm init -y >/dev/null && npm install lodash@4.17.21
          code=$(curl -s -o /dev/null -w '%{http_connect}' --cacert "$SSL_CERT_FILE" https://pastebin.com/ || true)
          echo "CONNECT: $code"; test "$code" = "200"
      - name: Stop passes and reports the would-deny
        run: |
          out="$(pmg proxy stop --fail-on-violation 2>&1)"; echo "$out"
          grep -qF "would deny  pastebin.com:443  rule pastebin.com:443" <<<"$out"
      - name: Propose without enforce, as the docs show
        run: |
          pmg sandbox profile propose --run "$PMG_PROXY_RUN" --new pmg-network.yml
          grep -qF -- "- registry.npmjs.org:443" pmg-network.yml
          pmg sandbox profile lint pmg-network.yml

  np-advisory-enforce:
    name: "@v0.33.0 network-profile, enforce (advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - *docs-profile
      - uses: safedep/pmg@v0.33.0
        with:
          version: v0.33.0
          server-mode: true
          network-profile: .pmg/profiles/ci.yml
          network-mode: enforce
      - name: Installs work, malware and denied hosts are refused
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm install lodash@4.17.21
          if npm --no-cache --prefer-online install safedep-test-pkg@0.1.3; then exit 1; fi
          for u in https://pastebin.com/ https://1.1.1.1/ https://example.com/; do
            code=$(curl -s -o /dev/null -w '%{http_connect}' --cacert "$SSL_CERT_FILE" "$u" || true)
            echo "$u CONNECT: $code"; test "$code" = "403"
          done
      - name: Stop fails and names the denials
        if: always()
        run: |
          set +e; out="$(pmg proxy stop --fail-on-violation 2>&1)"; code=$?; set -e
          echo "$out"; test "$code" -ne 0
          grep -qF "denied  pastebin.com:443  rule pastebin.com:443" <<<"$out"
          grep -qF "rule ip_literal" <<<"$out"
          grep -qF "were blocked" <<<"$out"

  np-kernel-enforce:
    name: "@v0.33.0 enforce, docs profile, enforce"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - *docs-profile
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          enforce: true
          network-profile: .pmg/profiles/ci.yml
          network-mode: enforce
      - name: Status
        run: sudo "$PMG_BIN" proxy status --state "$PMG_PROXY_STATE"
      - name: Install works, malware is blocked for a scrubbed client
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm install lodash@4.17.21
          code=$(env -i /usr/bin/curl -s -o /dev/null -w '%{http_code}' https://registry.npmjs.org/safedep-test-pkg/-/safedep-test-pkg-0.1.3.tgz || true)
          echo "scrubbed tarball fetch: $code"; test "$code" = "403"
      - name: Denied host and IP literal are refused for a scrubbed client
        run: |
          if env -i /usr/bin/curl -sS -o /dev/null https://pastebin.com/; then exit 1; fi
          if env -i /usr/bin/curl -sS -o /dev/null https://1.1.1.1/; then exit 1; fi
      - name: Stop fails and names the program
        if: always()
        run: |
          set +e; out="$(sudo "$PMG_BIN" proxy stop --state "$PMG_PROXY_STATE" --fail-on-violation 2>&1)"; code=$?; set -e
          echo "$out"; test "$code" -ne 0
          grep -qE "denied  pastebin.com:443 +rule pastebin.com:443 +/usr/bin/curl pid [0-9]+" <<<"$out"

  np-kernel-namespaces:
    name: "@v0.33.0 enforce, redirect containers, profile"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the image before enforcement
        run: docker pull curlimages/curl:8.11.1
      - *docs-profile
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          enforce: true
          enforce-namespaces: redirect
          network-profile: .pmg/profiles/ci.yml
          network-mode: enforce
      - name: A container reaches the registry and is refused elsewhere
        run: |
          code=$(docker run --rm -v "$PMG_CA_BUNDLE:/ca.pem:ro" curlimages/curl:8.11.1 -s --cacert /ca.pem -o /dev/null -w '%{http_code}' https://registry.npmjs.org/lodash || true)
          echo "registry from a container: $code"; test "$code" = "200"
          if docker run --rm curlimages/curl:8.11.1 -sS -m 15 -o /dev/null https://pastebin.com/; then echo "::error::container reached pastebin"; exit 1; fi
      - name: Stop fails and names the container
        if: always()
        run: |
          set +e; out="$(sudo "$PMG_BIN" proxy stop --state "$PMG_PROXY_STATE" --fail-on-violation 2>&1)"; code=$?; set -e
          echo "$out"; test "$code" -ne 0
          grep -qF "denied  pastebin.com:443" <<<"$out"

  np-propose:
    name: "@v0.33.0 enforce, no profile, propose (docs)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Write a project with a lockfile
        run: |
          npm init -y >/dev/null
          npm install --package-lock-only lodash@4.17.21 express@4.21.2
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          enforce: true
      - run: npm ci
      - name: Stop PMG
        if: always()
        run: sudo "$PMG_BIN" proxy stop --state "$PMG_PROXY_STATE" --fail-on-violation
      - name: Propose the network profile
        if: always()
        run: sudo "$PMG_BIN" sandbox profile propose --run "$PMG_PROXY_RUN" --new pmg-network.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pmg-network-profile
          path: pmg-network.yml

  np-apply-proposed:
    name: "@v0.33.0 enforce, the proposed profile"
    needs: np-propose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pmg-network-profile
      - name: Commit the proposal as the docs say
        run: |
          mkdir -p .pmg/profiles && mv pmg-network.yml .pmg/profiles/ci.yml && cat .pmg/profiles/ci.yml
          mkdir app && cd app && npm init -y >/dev/null && npm install --package-lock-only lodash@4.17.21 express@4.21.2
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          enforce: true
          network-profile: .pmg/profiles/ci.yml
          network-mode: enforce
      - run: npm ci
        working-directory: app
      - name: A destination the run did not reach is refused
        run: if env -i /usr/bin/curl -sS -o /dev/null https://pastebin.com/; then exit 1; fi
      - name: Stop fails on the refused destination
        if: always()
        run: |
          set +e; out="$(sudo "$PMG_BIN" proxy stop --state "$PMG_PROXY_STATE" --fail-on-violation 2>&1)"; code=$?; set -e
          echo "$out"; test "$code" -ne 0
          grep -qE "denied  pastebin.com:443 +rule \*:\*" <<<"$out"

  np-container-expose:
    name: "@v0.33.0 job container, expose, profile, enforce"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *docs-profile
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          expose-to-job-network: true
          network-profile: .pmg/profiles/ci.yml
          network-mode: enforce
      - name: The job container is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_connect}' --cacert "$SSL_CERT_FILE" https://pastebin.com/ || true)
          echo "CONNECT: $code"; test "$code" = "403"
      - name: Write the check for the Docker action
        run: |
          cat > pmg-docker-check.sh <<'EOF'
          set -euo pipefail
          cd "$(mktemp -d)"; npm init -y >/dev/null; npm install lodash@4.17.21
          code=$(curl -s -o /dev/null -w '%{http_connect}' --cacert "$NODE_EXTRA_CA_CERTS" https://pastebin.com/ || true)
          echo "CONNECT from the Docker action: $code"; test "$code" = "403"
          EOF
      - name: A Docker action is refused too
        uses: docker://node:24@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
        with:
          entrypoint: bash
          args: /github/workspace/pmg-docker-check.sh
      - name: Stop fails
        if: always()
        run: |
          set +e; out="$(pmg proxy stop --fail-on-violation 2>&1)"; code=$?; set -e
          echo "$out"; test "$code" -ne 0; grep -qF "denied  pastebin.com:443" <<<"$out"

  np-alpine:
    name: "@v0.33.0 Alpine job container, profile, enforce"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24-alpine
      options: --init
    defaults:
      run:
        shell: sh
    steps:
      - name: Write the profile
        run: |
          mkdir -p .pmg/profiles
          printf '%s\n' 'name: ci' 'inherits: npm-restrictive' 'network:' '  deny_outbound:' '    - pastebin.com:443' > .pmg/profiles/ci.yml
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          network-profile: .pmg/profiles/ci.yml
          network-mode: enforce
      - name: Install works, wget is refused, stop fails
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm install lodash@4.17.21
          if wget -q -O /dev/null https://pastebin.com/; then exit 1; fi
          if pmg proxy stop --fail-on-violation; then exit 1; fi

  np-config-file:
    name: "@v0.33.0 config-file names the profile (with and without enforce)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        enforce: ["false", "true"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the config and the profile
        run: |
          mkdir -p .pmg/profiles
          printf '%s\n' 'name: ci' 'inherits: npm-restrictive' 'network:' '  allow_outbound:' '    - "*.actions.githubusercontent.com:443"' '    - "*.githubapp.com:443"' '  deny_outbound:' '    - pastebin.com:443' > .pmg/profiles/ci.yml
          printf '%s\n' 'proxy:' '  server:' '    profile: .pmg/profiles/ci.yml' '    network_mode: enforce' > .pmg/config.yml
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          enforce: ${{ matrix.enforce }}
          config-file: .pmg/config.yml
      - name: The policy from the config applies
        run: |
          if [ "${{ matrix.enforce }}" = "true" ]; then
            sudo "$PMG_BIN" proxy status --state "$PMG_PROXY_STATE" | tee status.txt
            if env -i /usr/bin/curl -sS -o /dev/null https://pastebin.com/; then exit 1; fi
            if sudo "$PMG_BIN" proxy stop --state "$PMG_PROXY_STATE" --fail-on-violation; then exit 1; fi
            sudo env PMG_CONFIG_DIR="$PMG_PROXY_CONFIG_DIR" "$PMG_BIN" sandbox profile propose --run "$PMG_PROXY_RUN"
          else
            pmg proxy status | tee status.txt
            code=$(curl -s -o /dev/null -w '%{http_connect}' --cacert "$SSL_CERT_FILE" https://pastebin.com/ || true)
            test "$code" = "403"
            if pmg proxy stop --fail-on-violation; then exit 1; fi
          fi
          grep -qF "Network policy: enforce, profile npm-restrictive <" status.txt

  np-edge-inputs:
    name: "@v0.33.0 built-in name, skip-event-logging, missing profile, inputs without server-mode"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          network-profile: npm-restrictive
          skip-event-logging: true
      - name: A built-in name loads and no run id is set
        run: |
          pmg proxy status | tee status.txt
          grep -qF "Network policy: audit, profile npm-restrictive, enforce: off, policy advisory" status.txt
          test -z "${PMG_PROXY_RUN:-}"
          pmg proxy stop --fail-on-violation
      - name: A missing profile fails the action
        id: missing
        continue-on-error: true
        uses: safedep/pmg@v0.33.0
        with:
          server-mode: true
          network-profile: .pmg/profiles/missing.yml
      - run: test "${{ steps.missing.outcome }}" = "failure"
