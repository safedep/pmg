name: MDM Scripts

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/mdm/**
      - .github/workflows/mdm.yml
  push:
    branches: [main]
    paths:
      - scripts/mdm/**
      - .github/workflows/mdm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mdm-scripts-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test standalone script generation
        run: bash scripts/mdm/tests/generate_standalone_test.sh

      - name: Check generated standalone scripts
        run: |
          bash scripts/mdm/generate_standalone_macos.sh --check
          bash scripts/mdm/generate_standalone_linux.sh --check

      - name: Test OS refusal guards
        run: bash scripts/mdm/tests/os_guard_test.sh

      - name: Test installer behavior
        run: bash scripts/mdm/tests/pmg_setup_install_test.sh

      - name: Lint MDM scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck -x -P SCRIPTDIR -P scripts/mdm/lib \
            scripts/mdm/macos/lib_macos.sh \
            scripts/mdm/linux/lib_linux.sh \
            scripts/mdm/macos/pmg_setup_install_macos.sh \
            scripts/mdm/macos/pmg_uninstall_macos.sh \
            scripts/mdm/linux/pmg_setup_install_linux.sh \
            scripts/mdm/linux/pmg_uninstall_linux.sh \
            scripts/mdm/lib/generate_standalone_lib.sh \
            scripts/mdm/lib/test_lib.sh \
            scripts/mdm/generate_standalone_macos.sh \
            scripts/mdm/generate_standalone_linux.sh \
            scripts/mdm/tests/generate_standalone_test.sh \
            scripts/mdm/tests/pmg_setup_install_test.sh \
            scripts/mdm/tests/os_guard_test.sh \
            scripts/mdm/tests/e2e_lib_macos.sh \
            scripts/mdm/tests/e2e_lib_linux.sh \
            scripts/mdm/tests/standalone_macos_e2e_test.sh \
            scripts/mdm/tests/standalone_linux_e2e_test.sh \
            scripts/mdm/tests/multifile_macos_e2e_test.sh \
            scripts/mdm/tests/multifile_linux_e2e_test.sh \
            scripts/mdm/standalone/pmg_setup_install_macos_standalone.sh \
            scripts/mdm/standalone/pmg_uninstall_macos_standalone.sh \
            scripts/mdm/standalone/pmg_setup_install_linux_standalone.sh \
            scripts/mdm/standalone/pmg_uninstall_linux_standalone.sh

  mdm-scripts-macos-multifile-e2e:
    runs-on: macos-latest
    needs: mdm-scripts-test
    timeout-minutes: 20
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test multifile scripts on macOS
        env:
          PMG_MDM_E2E: "1"
        run: bash scripts/mdm/tests/multifile_macos_e2e_test.sh

  mdm-scripts-macos-standalone-e2e:
    runs-on: macos-latest
    needs: mdm-scripts-test
    timeout-minutes: 20
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test standalone scripts on macOS
        env:
          PMG_MDM_E2E: "1"
        run: bash scripts/mdm/tests/standalone_macos_e2e_test.sh

  mdm-scripts-linux-multifile-e2e:
    runs-on: ubuntu-latest
    needs: mdm-scripts-test
    timeout-minutes: 20
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test multifile scripts on Linux
        env:
          PMG_MDM_E2E: "1"
        run: bash scripts/mdm/tests/multifile_linux_e2e_test.sh

  mdm-scripts-linux-standalone-e2e:
    runs-on: ubuntu-latest
    needs: mdm-scripts-test
    timeout-minutes: 20
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test standalone scripts on Linux
        env:
          PMG_MDM_E2E: "1"
        run: bash scripts/mdm/tests/standalone_linux_e2e_test.sh

  # Windows has its own scripts, tests and lint. PSScriptAnalyzer ships on
  # the runner image. The unit test runs in both hosts, because Intune runs
  # Windows PowerShell and developers run PowerShell 7.
  mdm-scripts-windows-test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Windows MDM scripts
        run: |
          $results = @()
          foreach ($dir in 'scripts/mdm/windows', 'scripts/mdm/standalone', 'scripts/mdm/tests') {
            $results += Invoke-ScriptAnalyzer -Path $dir -Recurse -Settings scripts/mdm/windows/PSScriptAnalyzerSettings.psd1 -Severity Warning, Error
          }
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results) { throw "PSScriptAnalyzer reported $($results.Count) findings" }

      - name: Test installer behavior in PowerShell 7
        run: pwsh -NoProfile -File scripts/mdm/tests/pmg_setup_install_windows_test.ps1

      - name: Test installer behavior in Windows PowerShell
        shell: powershell
        run: powershell -NoProfile -File scripts/mdm/tests/pmg_setup_install_windows_test.ps1

  mdm-scripts-windows-multifile-e2e:
    runs-on: windows-latest
    needs: mdm-scripts-windows-test
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      # The installer takes a sibling pmg.exe. The latest release does not
      # carry the Windows system install yet, so the test installs this build.
      - name: Build PMG
        run: go build -o bin\pmg.exe .

      - name: Test multifile scripts on Windows
        env:
          PMG_MDM_E2E: "1"
          PMG_E2E_BINARY: ${{ github.workspace }}\bin\pmg.exe
        run: pwsh -NoProfile -File scripts/mdm/tests/multifile_windows_e2e_test.ps1

  # The Windows generator and its test are bash, so they run where the other
  # generator tests run. pwsh on the runner covers the Windows-only guard.
  mdm-scripts-windows-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test Windows standalone script generation
        run: bash scripts/mdm/tests/generate_standalone_windows_test.sh

      - name: Check generated Windows standalone scripts
        run: bash scripts/mdm/generate_standalone_windows.sh --check

      - name: Lint the Windows generator
        run: |
          shellcheck -x -P SCRIPTDIR -P scripts/mdm/lib \
            scripts/mdm/generate_standalone_windows.sh \
            scripts/mdm/tests/generate_standalone_windows_test.sh

  mdm-scripts-windows-standalone-e2e:
    runs-on: windows-latest
    needs: [mdm-scripts-windows-test, mdm-scripts-windows-generate]
    timeout-minutes: 20
    env:
      # This is the first release with the Windows system install.
      # Bump it intentionally to keep this download test reproducible.
      PMG_VERSION: v0.29.0-edge.3
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate the standalone installer with embedded config and credentials
        shell: bash
        env:
          SAFEDEP_API_KEY: pmg-mdm-e2e-api-key
          SAFEDEP_TENANT_ID: pmg-mdm-e2e-tenant
        run: |
          printf 'paranoid: true\ncloud:\n  enabled: true\n' > "$RUNNER_TEMP/config.yml"
          bash scripts/mdm/generate_standalone_windows.sh --config "$RUNNER_TEMP/config.yml" --embed-cloud-credentials --output-dir "$RUNNER_TEMP/standalone"

      - name: Test standalone scripts on Windows
        env:
          PMG_MDM_E2E: "1"
          PMG_E2E_STANDALONE_DIR: ${{ runner.temp }}\standalone
          PMG_E2E_CONFIG: ${{ runner.temp }}\config.yml
        run: pwsh -NoProfile -File scripts/mdm/tests/standalone_windows_e2e_test.ps1
