name: Release Automation

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-edge.[0-9]+"

concurrency: ci-release-automation

permissions:
  contents: read

# Release builds restore and save no cache. The cache service enforces this,
# so no step can restore a cache that another workflow wrote.
cache-mode: none

jobs:
  release:
    timeout-minutes: 60
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Add a new value to git.ignore_tags in .goreleaser.yaml in the same change.
      ACTION_TAG: v2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds must not restore caches that other workflows can write.
          cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve previous stable tag
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          # Without this the changelog for a stable release spans only the
          # commits since the most recent edge tag.
          prev=$(git tag --merged "${GITHUB_REF_NAME}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vFx "${GITHUB_REF_NAME}" | sort -V | tail -1)
          if [ -n "$prev" ]; then
            echo "GORELEASER_PREVIOUS_TAG=${prev}" >> "$GITHUB_ENV"
          fi

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: "~> v2"

      - name: Install wixl for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wixl

      - name: Build release (goreleaser via Nx)
        run: pnpm nx run pmg:build-release
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          # Without this goreleaser picks the current tag from the tags that
          # point at HEAD. A stable tag and an edge tag on the same commit then
          # release the edge tag twice.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Attest Go binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish npm packages (sync + build + publish via Nx)
        if: ${{ !contains(github.ref_name, '-') }}
        run: pnpm nx run pmg:publish-npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The next steps move the major tag of the GitHub Action
      # (uses: safedep/pmg@v2) to a stable release. They run in this job so
      # that the npm-release approval also guards the app key. No workflow
      # triggers on the major tag, and git.ignore_tags in .goreleaser.yaml
      # keeps goreleaser off it. No release exists on it, so immutable
      # releases do not lock it. The release app pushes the tag because the
      # tag ruleset blocks the workflow token.
      #
      # A failed move marks its step red but does not fail this job. So the
      # later jobs and their re-runs work as before. A re-run of this job
      # fails at the goreleaser step, so a failed move needs a manual tag
      # push. Before the push, check where the tag points now. The move can
      # succeed when only the last check fails, and a newer release can move
      # the tag first. Push it only to the highest stable tag whose release
      # job succeeded. A newer tag can wait for its release approval.
      #
      # A re-run of an older release or a patch of an older line must not
      # move the tag back. GitHub marks a patch of an older line as the
      # latest release too. So the check uses the highest tag.
      - name: Check that this is the highest stable tag
        id: check
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The highest stable tag is ${highest}, not ${GITHUB_REF_NAME}. ${ACTION_TAG} does not move."
          fi

      - name: Get a token of the release app
        if: steps.check.outputs.move == 'true'
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_KEY }}
          owner: safedep
          repositories: pmg
          permission-contents: write

      # The API writes a ref that points at the commit, which is a
      # lightweight tag. git tag -a would make an annotated tag.
      - name: Move the tag
        if: steps.check.outputs.move == 'true' && steps.app.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ACTION_TAG}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${ACTION_TAG}" -f sha="$sha" -F force=true > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${ACTION_TAG}" -f sha="$sha" > /dev/null
          fi
          got=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ACTION_TAG}" --jq '.object.type + " " + .object.sha')
          if [ "$got" != "commit ${sha}" ]; then
            echo "::error::${ACTION_TAG} points to ${got}, not the commit ${sha}"
            exit 1
          fi
          echo "${ACTION_TAG} now points to ${GITHUB_REF_NAME} (${sha})"

  test-installation:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22", "24"]
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Installs the package this workflow just published. That is the test.
      # The registry CDN can serve the version metadata minutes before the
      # tarballs, so retry the real install and not a metadata query. The
      # platform package is an optional dependency and npm skips it without
      # an error, so the retry also runs the binary.
      - name: Install and smoke test
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: | # zizmor: ignore[adhoc-packages]
          for i in $(seq 1 30); do
            npm install -g --prefer-online "@safedep/pmg@${VERSION}" && pmg version && exit 0
            echo "Install of @safedep/pmg@${VERSION} failed. Retrying... ($i/30)"
            sleep 30
          done
          echo "Install of @safedep/pmg@${VERSION} failed after 15 minutes"
          exit 1

  # Runs for edge releases too, so an edge tag proves the installer before
  # the stable tag ships it.
  test-msi:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the installer from the release
        run: scripts/msi/download_release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -OutDir "$env:RUNNER_TEMP\msi"

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install and uninstall the MSI
        env:
          PMG_MSI: ${{ runner.temp }}\msi\pmg_Windows_x86_64.msi
          PMG_MSI_VERSION: ${{ steps.version.outputs.version }}
          PMG_MSI_LOG_DIR: ${{ runner.temp }}\msi-logs
        run: pwsh -NoProfile -File scripts/msi/tests/msi_e2e_test.ps1

      - name: Upload the installer logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-logs
          path: ${{ runner.temp }}\msi-logs
          if-no-files-found: ignore

  # Stable releases only, like npm. The Chocolatey package goes to the
  # community repository and the winget manifests to microsoft/winget-pkgs
  # as a pull request that its maintainers review. The secrets live in the
  # same environment as the npm token. Without a secret the job builds and
  # tests the package and skips the publish step.
  #
  # Both packages build and test before either one publishes. Chocolatey
  # rejects a second push of the same version, so a push that ran before a
  # failed winget step would stop every re-run of the job at the push.
  publish-windows-packages:
    needs: test-msi
    if: ${{ !contains(github.ref_name, '-') }}
    environment: npm-release
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      MSI_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pmg_Windows_x86_64.msi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the installer from the release
        run: scripts/msi/download_release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -OutDir "$env:RUNNER_TEMP\msi"

      - name: Extract version
        run: '"VERSION=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_ENV'

      - name: Build the Chocolatey package
        run: scripts/choco/build.ps1 -Version $env:VERSION -MsiPath "$env:RUNNER_TEMP\msi\pmg_Windows_x86_64.msi" -MsiUrl $env:MSI_URL -OutDir "$env:RUNNER_TEMP\choco"

      - name: Install and uninstall from the Chocolatey package
        env:
          PMG_NUPKG_DIR: ${{ runner.temp }}\choco
          PMG_CHOCO_VERSION: ${{ env.VERSION }}
          PMG_MSI_VERSION: ${{ env.VERSION }}
        run: pwsh -NoProfile -File scripts/choco/tests/choco_e2e_test.ps1

      - name: Install winget
        run: scripts/winget/install_winget.ps1

      # The approval gate can hold this job past the release day, so the
      # release date comes from the release and not from the clock.
      - name: Build the winget manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDate = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json publishedAt --jq '.publishedAt[0:10]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          scripts/winget/build.ps1 -Version $env:VERSION -MsiPath "$env:RUNNER_TEMP\msi\pmg_Windows_x86_64.msi" -MsiUrl $env:MSI_URL -ReleaseDate $releaseDate -OutDir "$env:RUNNER_TEMP\winget"

      - name: Validate the manifests, then install and uninstall from them
        env:
          PMG_WINGET_MANIFEST_DIR: ${{ runner.temp }}\winget
          PMG_MSI_VERSION: ${{ env.VERSION }}
        run: pwsh -NoProfile -File scripts/winget/tests/winget_e2e_test.ps1

      - name: Push the package to the Chocolatey community repository
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) {
            Write-Host '::warning::CHOCO_API_KEY is not set. The Chocolatey package was built and tested but not pushed.'
            exit 0
          }
          $output = & choco push "$env:RUNNER_TEMP\choco\pmg.$env:VERSION.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            # A re-run after a failed winget submit pushes the same version
            # again. Chocolatey answers HTTP 409 for a version it already has.
            # Treat that as done so the re-run reaches the winget submit.
            if ($output -match '\(409\)') {
              Write-Host "::warning::pmg $env:VERSION is already on the Chocolatey repository. Skipping the push."
            } else {
              exit $LASTEXITCODE
            }
          }

      # A classic token with the public_repo scope. wingetcreate forks
      # microsoft/winget-pkgs under the token owner and opens the pull request
      # from the fork. A fine-grained token cannot open a pull request on a
      # repository outside its owner, so the release token does not work here.
      - name: Submit the manifests to microsoft/winget-pkgs
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host '::warning::WINGET_GITHUB_TOKEN is not set. The winget manifests were built and tested but not submitted.'
            exit 0
          }
          # A pinned release, and the Microsoft signature on the binary checked
          # before it runs with the token.
          $exe = "$env:RUNNER_TEMP\wingetcreate.exe"
          Invoke-WebRequest -Uri https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile $exe
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*O=Microsoft Corporation*') {
            throw "wingetcreate.exe is not signed by Microsoft: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          & $exe submit --token $env:WINGET_TOKEN "$env:RUNNER_TEMP\winget"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
