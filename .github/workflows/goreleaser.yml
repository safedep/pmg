name: Release Automation

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-edge.[0-9]+"

concurrency: ci-release-automation

permissions:
  contents: read

jobs:
  release:
    timeout-minutes: 60
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve previous stable tag
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          # Without this the changelog for a stable release spans only the
          # commits since the most recent edge tag.
          prev=$(git tag --merged "${GITHUB_REF_NAME}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vFx "${GITHUB_REF_NAME}" | sort -V | tail -1)
          if [ -n "$prev" ]; then
            echo "GORELEASER_PREVIOUS_TAG=${prev}" >> "$GITHUB_ENV"
          fi

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          install-only: true
          version: "~> v2"

      - name: Install wixl for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wixl

      - name: Build release (goreleaser via Nx)
        run: pnpm nx run pmg:build-release
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          # Without this goreleaser picks the current tag from the tags that
          # point at HEAD. A stable tag and an edge tag on the same commit then
          # release the edge tag twice.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Attest Go binary provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish npm packages (sync + build + publish via Nx)
        if: ${{ !contains(github.ref_name, '-') }}
        run: pnpm nx run pmg:publish-npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  test-installation:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22", "24"]
    steps:
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for package on registry
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The registry makes the wrapper and the platform packages visible in
          # any order, so wait for the platform package this runner needs too.
          plat=$(node -p "process.platform + '-' + process.arch")
          for i in $(seq 1 20); do
            npm view "@safedep/pmg@${VERSION}" version > /dev/null 2>&1 \
              && npm view "@safedep/pmg-${plat}@${VERSION}" version > /dev/null 2>&1 && break
            echo "Waiting for @safedep/pmg and @safedep/pmg-${plat} at ${VERSION}... ($i/20)"
            sleep 30
            [ "$i" -eq 20 ] && echo "Packages not available after 10 minutes" && exit 1
          done

      - name: Install
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm install -g "@safedep/pmg@${VERSION}"

      - name: Smoke test
        run: pmg version

  # Runs for edge releases too, so an edge tag proves the installer before
  # the stable tag ships it.
  test-msi:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the installer from the release
        run: scripts/msi/download_release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -OutDir "$env:RUNNER_TEMP\msi"

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install and uninstall the MSI
        env:
          PMG_MSI: ${{ runner.temp }}\msi\pmg_Windows_x86_64.msi
          PMG_MSI_VERSION: ${{ steps.version.outputs.version }}
          PMG_MSI_LOG_DIR: ${{ runner.temp }}\msi-logs
        run: pwsh -NoProfile -File scripts/msi/tests/msi_e2e_test.ps1

      - name: Upload the installer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msi-logs
          path: ${{ runner.temp }}\msi-logs
          if-no-files-found: ignore

  # Runs for edge releases too. An edge release becomes a prerelease package
  # that only `choco install pmg --pre` picks.
  publish-chocolatey:
    needs: test-msi
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      MSI_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pmg_Windows_x86_64.msi
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the installer from the release
        run: scripts/msi/download_release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -OutDir "$env:RUNNER_TEMP\msi"

      - name: Extract version
        id: version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "choco_version=$(VERSION="$version" pwsh -NoProfile -Command '. scripts/msi/wrap_lib.ps1; ConvertTo-ChocolateyVersion $env:VERSION')" >> "$GITHUB_OUTPUT"

      - name: Build the Chocolatey package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/choco/build.ps1 -Version $env:VERSION -MsiPath "$env:RUNNER_TEMP\msi\pmg_Windows_x86_64.msi" -MsiUrl $env:MSI_URL -OutDir "$env:RUNNER_TEMP\choco"

      - name: Install and uninstall from the package
        env:
          PMG_NUPKG_DIR: ${{ runner.temp }}\choco
          PMG_CHOCO_VERSION: ${{ steps.version.outputs.choco_version }}
          PMG_MSI_VERSION: ${{ steps.version.outputs.version }}
        run: pwsh -NoProfile -File scripts/choco/tests/choco_e2e_test.ps1

      - name: Push the package to the Chocolatey community repository
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          CHOCO_VERSION: ${{ steps.version.outputs.choco_version }}
        run: |
          if (-not $env:CHOCO_API_KEY) {
            Write-Host '::warning::CHOCO_API_KEY is not set. The Chocolatey package was built and tested but not pushed.'
            exit 0
          }
          choco push "$env:RUNNER_TEMP\choco\pmg.$env:CHOCO_VERSION.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # winget gets stable releases only. The manifests go to microsoft/winget-pkgs
  # as a pull request that its maintainers review.
  publish-winget:
    needs: test-msi
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      MSI_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pmg_Windows_x86_64.msi
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the installer from the release
        run: scripts/msi/download_release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -OutDir "$env:RUNNER_TEMP\msi"

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install winget
        run: scripts/winget/install_winget.ps1

      - name: Build the winget manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/winget/build.ps1 -Version $env:VERSION -MsiPath "$env:RUNNER_TEMP\msi\pmg_Windows_x86_64.msi" -MsiUrl $env:MSI_URL -OutDir "$env:RUNNER_TEMP\winget"

      - name: Validate the manifests, then install and uninstall from them
        env:
          PMG_WINGET_MANIFEST_DIR: ${{ runner.temp }}\winget
          PMG_MSI_VERSION: ${{ steps.version.outputs.version }}
        run: pwsh -NoProfile -File scripts/winget/tests/winget_e2e_test.ps1

      - name: Submit the manifests to microsoft/winget-pkgs
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host '::warning::WINGET_TOKEN is not set. The winget manifests were built and tested but not submitted.'
            exit 0
          }
          # A pinned release, and the Microsoft signature on the binary checked
          # before it runs with the token.
          $exe = "$env:RUNNER_TEMP\wingetcreate.exe"
          Invoke-WebRequest -Uri https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile $exe
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*O=Microsoft Corporation*') {
            throw "wingetcreate.exe is not signed by Microsoft: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          & $exe submit --token $env:WINGET_TOKEN "$env:RUNNER_TEMP\winget"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
