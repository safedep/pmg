# .github/workflows/persistent-proxy-e2e.yml
name: Persistent Proxy E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "cmd/proxy/**"
      - "internal/proxyserver/**"
      - "internal/netenforce/**"
      - "internal/flows/cert.go"
      - "proxy/**"
      - "sandbox/**"
      - "test/e2e/**"
      - "action.yml"
      - "action/**"
      - ".github/workflows/persistent-proxy-e2e.yml"

permissions:
  contents: read

jobs:
  persistent-proxy-e2e:
    name: Persistent Proxy E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAFEDEP_API_KEY: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
      SAFEDEP_TENANT_ID: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN}}
      PMG_CLOUD_ENABLED: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build PMG
        run: make

      - name: Add pmg to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Start proxy daemon
        run: |
          pmg proxy start --daemon --profile test/e2e/network-profile.yml --network-mode enforce | tee start.txt
          grep -q "Network policy: enforce, profile $GITHUB_WORKSPACE/test/e2e/network-profile.yml, enforce: off, policy advisory" start.txt

      - name: Inject proxy env
        run: pmg proxy env >> "$GITHUB_ENV"

      - name: Run proxy E2E assertions
        uses: $/.github/actions/proxy-e2e-assertions

      # curl drops the body of a refused CONNECT, so the CONNECT status is
      # the check. The body is covered in test/proxye2e.
      - name: A denied host gets a 403 from the proxy
        run: |
          code=$(curl -s -o /dev/null -w '%{http_connect}' --cacert "$SSL_CERT_FILE" https://pastebin.com/ || true)
          test "$code" = "403"

      - name: Stop proxy and verify it fails on the blocks
        if: always()
        shell: bash
        run: |
          set +e
          out="$(pmg proxy stop --fail-on-violation 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "Network policy: enforce, 1 denied, 0 would deny" <<<"$out"
          grep -q "denied  pastebin.com:443  rule pastebin.com:443" <<<"$out"
          grep -q "Profile: $GITHUB_WORKSPACE/test/e2e/network-profile.yml" <<<"$out"
          grep -q "connection(s) were denied by the network policy" <<<"$out"
          echo "OK: stop correctly failed on the policy violation"

  # Kernel enforcement needs root, kernel BTF and cgroup v2. The hosted
  # runner has all three. The e2e test drives child processes through the
  # attached programs. The second half runs the real daemon with --enforce
  # and proves that a scrubbed-environment client is routed and blocked.
  ebpf-enforce-e2e:
    name: eBPF Enforcement E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The build and the module download run as the runner user first, so
      # the root step only reads the module cache. A root process that
      # unpacks modules leaves root-owned directories the runner user cannot
      # write to later. Root gets its own build cache for the same reason.
      - name: Build PMG
        run: make

      - name: Download modules
        run: go mod download

      - name: Run the enforcement e2e test as root
        env:
          GOCACHE: ${{ runner.temp }}/go-build-root
        run: sudo --preserve-env=CI,HOME,GOPATH,GOMODCACHE,GOCACHE,GOFLAGS "$(command -v go)" test -tags ebpf_e2e -count=1 -v ./internal/netenforce/ -run E2E

      - name: Install the system CA and start the enforcing daemon
        run: |
          sudo "$GITHUB_WORKSPACE/bin/pmg" setup cert install --system
          # GITHUB_ACTIONS reaches the daemon, as in the action. The runner
          # is still not exempt.
          sudo --preserve-env=GITHUB_ACTIONS "$GITHUB_WORKSPACE/bin/pmg" proxy start --daemon --enforce --state "$RUNNER_TEMP/proxy-state.json" \
            --profile test/e2e/network-profile.yml --network-mode enforce
          sudo "$GITHUB_WORKSPACE/bin/pmg" proxy status --state "$RUNNER_TEMP/proxy-state.json" | tee status.txt
          grep -q "Kernel enforcement: active" status.txt
          grep -q "Network policy: enforce, profile $GITHUB_WORKSPACE/test/e2e/network-profile.yml$" status.txt
          if grep -q "exempt executable" status.txt; then
            echo "ERROR: the daemon exempted an executable that no policy lists" >&2
            exit 1
          fi
          sudo "$GITHUB_WORKSPACE/bin/pmg" proxy env --state "$RUNNER_TEMP/proxy-state.json" >> "$GITHUB_ENV"

      - name: A scrubbed-environment client is routed and blocked
        run: |
          env -i /usr/bin/curl -sS -o /dev/null -v https://registry.npmjs.org/ 2>&1 | grep -q "SafeDep PMG Proxy CA"
          code=$(env -i /usr/bin/curl -sS -o /dev/null -w '%{http_code}' https://registry.npmjs.org/safedep-test-pkg/-/safedep-test-pkg-0.1.3.tgz)
          test "$code" = "403"
          # The request must succeed, or a refused connection would pass as
          # "not intercepted". grep -v would pass on any non-matching line,
          # so the absence is checked as a failed positive match.
          out=$(env -i /usr/bin/curl -sS -o /dev/null -v https://github.com/ 2>&1)
          if grep -q "SafeDep PMG Proxy CA" <<<"$out"; then
            echo "ERROR: github.com was intercepted" >&2
            exit 1
          fi

      # A job step can write the runner's folder. A program it copies there
      # must still be routed, whatever its name.
      - name: A program copied into the runner folder is not exempt
        run: |
          pid="$(pgrep -x Runner.Worker | head -1 || true)"
          if [ -z "$pid" ]; then
            echo "ERROR: no Runner.Worker process found, so the runner folder is unknown" >&2
            exit 1
          fi
          worker="$(readlink "/proc/$pid/exe")"
          copy="$(dirname "$worker")/Runner.PmgE2E"
          trap 'rm -f "$copy"' EXIT
          cp /usr/bin/curl "$copy"
          code=$("$copy" -sS -o /dev/null -w '%{http_code}' https://registry.npmjs.org/safedep-test-pkg/-/safedep-test-pkg-0.1.3.tgz)
          test "$code" = "403"

      # The kernel names the program, so the stop report carries it. A TLS
      # connection to a denied host is closed before the handshake.
      - name: A denied host is refused and the report names the program
        run: |
          if env -i /usr/bin/curl -sS -o /dev/null https://pastebin.com/; then
            echo "ERROR: the connection to the denied host went through" >&2
            exit 1
          fi

      - name: Node without the trust variable fails closed
        run: |
          out=$(env -i "$(command -v node)" -e 'fetch("https://registry.npmjs.org/lodash").then(r => console.log("status", r.status), e => console.log("error", e.cause?.code ?? e.message))')
          echo "$out"
          # Node names the failure after the chain it saw. Both codes are a
          # closed failure on the PMG certificate.
          grep -Eq "SELF_SIGNED_CERT_IN_CHAIN|UNABLE_TO_VERIFY_LEAF_SIGNATURE" <<<"$out"

      - name: Stop and verify it fails on the block
        if: always()
        run: |
          # An earlier step failed before the daemon started: nothing to stop.
          if [ ! -f "$RUNNER_TEMP/proxy-state.json" ]; then
            exit 0
          fi
          set +e
          out="$(sudo "$GITHUB_WORKSPACE/bin/pmg" proxy stop --state "$RUNNER_TEMP/proxy-state.json" --fail-on-violation 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "ERROR: stop should have exited non-zero (a package was blocked)"
            exit 1
          fi
          grep -Eq "denied +pastebin.com:443 +rule pastebin.com:443 +/usr/bin/curl pid [0-9]+" <<<"$out"
          grep -q "Profile: $GITHUB_WORKSPACE/test/e2e/network-profile.yml  ports 80,443" <<<"$out"
          out=$(env -i /usr/bin/curl -sS -o /dev/null -v https://registry.npmjs.org/ 2>&1)
          if grep -q "SafeDep PMG Proxy CA" <<<"$out"; then
            echo "ERROR: enforcement is still on after the stop" >&2
            exit 1
          fi

  # The GitHub Actions journey from docs/github-action.md, with the binary
  # from this commit. An enforced run with no profile records every
  # destination, `pmg proxy env` exports the run id, the proposal after the
  # stop writes the profile, and a second daemon under that profile refuses
  # a destination the run did not reach.
  enforce-propose-e2e:
    name: Network profile from an enforced run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build PMG
        run: make

      - name: Observe with an enforcing daemon and no profile
        run: |
          sudo "$GITHUB_WORKSPACE/bin/pmg" setup cert install --system
          sudo --preserve-env=GITHUB_ACTIONS "$GITHUB_WORKSPACE/bin/pmg" proxy start --daemon --enforce --state "$RUNNER_TEMP/proxy-state.json" | tee start.txt
          grep -q "Network policy: none" start.txt
          sudo "$GITHUB_WORKSPACE/bin/pmg" proxy env --state "$RUNNER_TEMP/proxy-state.json" | tee env.txt >> "$GITHUB_ENV"
          grep -Eq '^PMG_PROXY_RUN=[0-9a-f]{12}$' env.txt

      - name: Reach the registry
        run: |
          code=$(env -i /usr/bin/curl -sS -o /dev/null -w '%{http_code}' https://registry.npmjs.org/lodash)
          test "$code" = "200"

      - name: Stop names the run
        run: |
          out="$(sudo "$GITHUB_WORKSPACE/bin/pmg" proxy stop --state "$RUNNER_TEMP/proxy-state.json" --fail-on-violation 2>&1)"
          echo "$out"
          grep -q "Destinations: [1-9][0-9]* observed. Propose a profile with: pmg sandbox profile propose --run $PMG_PROXY_RUN" <<<"$out"

      - name: Propose the network profile
        run: |
          sudo "$GITHUB_WORKSPACE/bin/pmg" sandbox profile propose --run "$PMG_PROXY_RUN" --new "$RUNNER_TEMP/pmg-network.yml" | tee propose.txt
          grep -q "add registry.npmjs.org:443" propose.txt
          grep -q "inherits: exec" "$RUNNER_TEMP/pmg-network.yml"
          grep -q -- "- registry.npmjs.org:443" "$RUNNER_TEMP/pmg-network.yml"
          grep -q -- '- "\*:\*"' "$RUNNER_TEMP/pmg-network.yml"
          "$GITHUB_WORKSPACE/bin/pmg" sandbox profile lint "$RUNNER_TEMP/pmg-network.yml"

      - name: Upload the profile as the docs do
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmg-network-profile
          path: ${{ runner.temp }}/pmg-network.yml

      - name: Enforce the proposed profile
        run: |
          sudo --preserve-env=GITHUB_ACTIONS "$GITHUB_WORKSPACE/bin/pmg" proxy start --daemon --enforce --state "$RUNNER_TEMP/proxy-state.json" \
            --profile "$RUNNER_TEMP/pmg-network.yml" --network-mode enforce | tee start.txt
          grep -q "Network policy: enforce, profile exec < $RUNNER_TEMP/pmg-network.yml" start.txt
          code=$(env -i /usr/bin/curl -sS -o /dev/null -w '%{http_code}' https://registry.npmjs.org/lodash)
          test "$code" = "200"
          if env -i /usr/bin/curl -sS -o /dev/null https://pastebin.com/; then
            echo "ERROR: the connection to a destination the run did not reach went through" >&2
            exit 1
          fi

      - name: Stop and verify it fails on the refused destination
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/proxy-state.json" ]; then
            exit 0
          fi
          set +e
          out="$(sudo "$GITHUB_WORKSPACE/bin/pmg" proxy stop --state "$RUNNER_TEMP/proxy-state.json" --fail-on-violation 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -Eq "denied +pastebin.com:443 +rule \*:\*" <<<"$out"
