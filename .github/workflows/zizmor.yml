name: zizmor

# Audits the workflows, actions and Dependabot config with zizmor and uploads
# the findings to code scanning. A code scanning merge protection rule blocks
# a pull request with findings; the job itself fails only on an error.
# Ignores live in .github/zizmor.yml and in inline comments.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload the SARIF results
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The zizmor version is pinned so a new audit lands in a deliberate bump.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.30.1"
