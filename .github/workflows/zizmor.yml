name: zizmor

# Audits the workflows, actions and Dependabot config with zizmor and fails on
# any finding. Ignores live in .github/zizmor.yml and in inline comments.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Annotations instead of Advanced Security, so a finding fails the check.
      # The zizmor version is pinned so a new audit lands in a deliberate bump.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          version: "1.30.1"
