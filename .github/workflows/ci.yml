name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# PRs share a concurrency group (cancel/serialize); Pushes use unique groups to avoid cancellation/queuing
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  run-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Build and Test
        run: |
          go mod tidy
          go build
          go test -coverprofile=coverage.txt -v ./...

      - name: Upload Coverage
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push'
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Runs the darwin-tagged tests (sandbox/platform/*_darwin_test.go) that no
  # other job can execute. Convention for darwin integration tests requiring
  # sandbox-exec: fail instead of skip when running in CI
  # (os.Getenv("CI") != "" => t.Fatal) so missing tooling cannot silently
  # hide security tests.
  test-macos:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and Test
        run: |
          go mod tidy
          go build
          go test -count=1 -v ./...

  test-windows:
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      # Git for Windows converts text files to CRLF on checkout. Tests that
      # compare an embedded template against a literal then fail.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      # The sandbox is not supported on Windows. Its packages are excluded
      # rather than tagged file by file.
      - name: Build and Test
        run: |
          go mod tidy
          go build -o pmg.exe main.go
          go test -count=1 -v $(go list ./... | Where-Object { $_ -notmatch '/sandbox' })

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          check-latest: true

      - name: Setup PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Build Binary
        run: make

      - name: Run E2E Tests
        run: chmod +x test/e2e.sh && ./test/e2e.sh
        shell: bash

  goreleaser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.upgrade.outputs.version }}
      base_version: ${{ steps.upgrade.outputs.base_version }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install wixl for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wixl

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --snapshot

      # Two more installers with the same version and a new product code each
      # have the shape of the next edge builds. Their binaries report a
      # different version string, so the Windows job can see which one is
      # installed.
      - name: Build the upgrade installers
        id: upgrade
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          version=$(jq -r .version dist/metadata.json)
          for suffix in upgrade upgrade2; do
            mkdir -p "dist/msi-$suffix"
            go build -ldflags "-s -w -X github.com/safedep/pmg/internal/version.Version=${version}-${suffix}" -o "dist/msi-$suffix/pmg.exe" .
            scripts/msi/build.sh windows amd64 "dist/msi-$suffix/pmg.exe" "$version" "dist/msi-$suffix/pmg_Windows_x86_64.msi"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base_version=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Upload the installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msi
          path: |
            dist/pmg_Windows_x86_64.msi
            dist/msi-upgrade/pmg_Windows_x86_64.msi
            dist/msi-upgrade2/pmg_Windows_x86_64.msi
          if-no-files-found: error

  msi-e2e-windows:
    needs: goreleaser-test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name msi --dir "$env:RUNNER_TEMP\msi"

      - name: Install, upgrade and uninstall the MSI
        env:
          PMG_MSI: ${{ runner.temp }}\msi\pmg_Windows_x86_64.msi
          PMG_MSI_VERSION: ${{ needs.goreleaser-test.outputs.version }}
          PMG_MSI_UPGRADE: ${{ runner.temp }}\msi\msi-upgrade\pmg_Windows_x86_64.msi
          PMG_MSI_UPGRADE_VERSION: ${{ needs.goreleaser-test.outputs.version }}-upgrade
          PMG_MSI_UPGRADE2: ${{ runner.temp }}\msi\msi-upgrade2\pmg_Windows_x86_64.msi
          PMG_MSI_UPGRADE2_VERSION: ${{ needs.goreleaser-test.outputs.version }}-upgrade2
          PMG_MSI_LOG_DIR: ${{ runner.temp }}\msi-logs
        run: pwsh -NoProfile -File scripts/msi/tests/msi_e2e_test.ps1

      - name: Upload the installer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msi-logs
          path: ${{ runner.temp }}\msi-logs
          if-no-files-found: ignore

  # The Chocolatey package and the winget manifests wrap the MSI. The stable
  # package wraps the first installer and the prerelease package the upgrade
  # installer, so the prerelease upgrade is visible in `pmg version`.
  wrappers-e2e-windows:
    needs: goreleaser-test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      BASE_VERSION: ${{ needs.goreleaser-test.outputs.base_version }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name msi --dir "$env:RUNNER_TEMP\msi"

      - name: Build the Chocolatey packages
        run: |
          scripts/choco/build.ps1 -Version $env:BASE_VERSION -MsiPath "$env:RUNNER_TEMP\msi\pmg_Windows_x86_64.msi" -MsiUrl "$env:RUNNER_TEMP\msi\pmg_Windows_x86_64.msi" -OutDir "$env:RUNNER_TEMP\choco"
          scripts/choco/build.ps1 -Version "$env:BASE_VERSION-edge.1" -MsiPath "$env:RUNNER_TEMP\msi\msi-upgrade\pmg_Windows_x86_64.msi" -MsiUrl "$env:RUNNER_TEMP\msi\msi-upgrade\pmg_Windows_x86_64.msi" -OutDir "$env:RUNNER_TEMP\choco"

      - name: Install, upgrade and uninstall through Chocolatey
        env:
          PMG_NUPKG_DIR: ${{ runner.temp }}\choco
          PMG_CHOCO_VERSION: ${{ needs.goreleaser-test.outputs.base_version }}
          PMG_MSI_VERSION: ${{ needs.goreleaser-test.outputs.version }}
          PMG_CHOCO_UPGRADE_VERSION: ${{ needs.goreleaser-test.outputs.base_version }}-edge001
          PMG_MSI_UPGRADE_VERSION: ${{ needs.goreleaser-test.outputs.version }}-upgrade
        run: pwsh -NoProfile -File scripts/choco/tests/choco_e2e_test.ps1

      - name: Install winget
        run: scripts/winget/install_winget.ps1

      # winget downloads the installer from the URL in the manifest, so a
      # local web server serves the installer for this run.
      - name: Validate the winget manifests, then install and uninstall from them
        env:
          PMG_WINGET_MANIFEST_DIR: ${{ runner.temp }}\winget
          PMG_MSI_VERSION: ${{ needs.goreleaser-test.outputs.version }}
        run: |
          $server = Start-Process -FilePath python -ArgumentList @('-m', 'http.server', '8765', '--bind', '127.0.0.1') -WorkingDirectory "$env:RUNNER_TEMP\msi" -PassThru
          try {
            scripts/winget/build.ps1 -Version $env:BASE_VERSION -MsiPath "$env:RUNNER_TEMP\msi\pmg_Windows_x86_64.msi" -MsiUrl 'http://127.0.0.1:8765/pmg_Windows_x86_64.msi' -OutDir $env:PMG_WINGET_MANIFEST_DIR
            pwsh -NoProfile -File scripts/winget/tests/winget_e2e_test.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $server.Id -Force
          }

      - name: Upload the Chocolatey log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chocolatey-log
          path: C:\ProgramData\chocolatey\logs\chocolatey.log
          if-no-files-found: ignore

  build-container-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Container Image
        run: |
          docker buildx build --platform linux/amd64 --load \
          -t build-container-test:latest .

  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          install-only: true
          version: "~> v2"

      # The preflight runs the goreleaser snapshot build, which builds the
      # Windows installer.
      - name: Install wixl for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wixl

      - name: Release preflight
        run: pnpm nx run pmg:release-preflight
