name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stale-handle-reproduction:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Reproduce cancellation after session close
        shell: pwsh
        run: |
          git clone --branch fix/windows-session-cleanup https://github.com/safedep/ptyx.git .diag-ptyx
          Set-Location .diag-ptyx
          git rev-parse HEAD
          $env:GOWORK = 'off'
          go test -race -v -run '^TestWinSession_(CancelAfterClose|ContextCancel|ConcurrentShutdown)$' -count=3 -timeout=90s

  repeat-original-test:
    if: false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Repeat the unchanged PMG argument test
        run: go test ./internal/runner -run '^TestArgvEquivalence$' -count=12 -v -timeout=6m
