name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility-review:
    name: Review (${{ matrix.version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        version: [base, head]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: Compare native cleanup behavior
        shell: pwsh
        env:
          REVIEW_VERSION: ${{ matrix.version }}
        run: |
          git clone https://github.com/safedep/ptyx.git .review-ptyx
          if ($env:REVIEW_VERSION -eq 'base') {
            git -C .review-ptyx checkout dd649ef656c456bda4b2067174a0e04562664f38
          } else {
            git -C .review-ptyx checkout c91ca8275bf36921748577758429456968425d23
          }
          Copy-Item .diagnostics/compatibility_windows_test.go .review-ptyx/
          Set-Location .review-ptyx
          git rev-parse HEAD
          $env:GOWORK = 'off'
          go test -v -run '^TestReview(Close|Kill)' -count=3 -timeout=60s .
