name: PMG E2E Tests - Windows

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
  workflow_dispatch:

# PRs share a concurrency group (cancel/serialize); Pushes use unique groups to avoid cancellation/queuing
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Steps run in pwsh and type the bare manager command, so each install goes
  # through the .cmd shim. Two steps repeat that in cmd.exe. Each step works in
  # RUNNER_TEMP, because the repo root is a pnpm workspace.
  # Out: `pmg go` (needs `pmg setup cert install` first), the sandbox (not on
  # Windows), aube (broken npm .ps1 wrapper upstream, see #457).
  e2e-windows:
    name: PMG E2E Tests - Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Setup PNPM
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a

      # The action installs Poetry but does not put it on PATH on Windows,
      # and its own output says to do that yourself. It also expects bash,
      # which this job is not.
      - name: Put Poetry on the job PATH
        run: '"$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'

      # Every manager this job drives, checked in one place before PMG is
      # installed, so a tool this job cannot set up on Windows fails here
      # with the whole list rather than one per run, thirty steps in. pip and
      # pip3 are not here: their step makes its own venv.
      - name: Verify the package managers are installed
        run: |
          $missing = @()
          foreach ($tool in 'node','npm','npx','pnpm','pnpx','yarn','python','uv','uvx','bun','poetry') {
            $resolved = Get-Command $tool -ErrorAction SilentlyContinue
            if ($resolved) {
              Write-Host "$tool -> $($resolved.Source)"
            } else {
              $missing += $tool
            }
          }
          if ($missing.Count -gt 0) { throw "not on PATH: $($missing -join ', ')" }

      - name: Build PMG
        run: go build -o bin\pmg.exe .

      - name: Add pmg to PATH
        run: '"$env:GITHUB_WORKSPACE\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'

      - name: Setup PMG
        run: pmg setup install

      # `pmg setup install` writes the shim directory to HKCU\Environment, which
      # a new shell reads. A workflow step does not, so the job PATH gets the
      # same entry. GITHUB_PATH prepends, which puts it ahead of Node's npm.cmd.
      - name: Put the shim directory on the job PATH
        run: '"$env:LOCALAPPDATA\safedep\pmg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'

      - name: Test PMG - Config File is Created
        run: |
          if (-not (Test-Path "$env:APPDATA\safedep\pmg\config.yml")) { throw "config.yml not found" }

      - name: Test PMG Shims and PATH Entry are Installed
        run: |
          $shims = "$env:LOCALAPPDATA\safedep\pmg\bin"
          foreach ($shim in 'npm','pip','pip3','pipx','pnpm','bun','uv','uvx','yarn','poetry','npx','pnpx','aube','aubr','aubx') {
            if (-not (Test-Path "$shims\$shim.cmd")) { throw "Missing shim: $shim.cmd" }
          }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if (-not $userPath.StartsWith($shims, 'OrdinalIgnoreCase')) { throw "shim directory is not first on the user PATH: $userPath" }
          # PMG installs no shell alias on Windows.
          if (Test-Path "$env:APPDATA\safedep\pmg\pmg.rc") { throw "an alias rc file must not exist on Windows" }
          # The shim, not Node's own npm.cmd, is what this shell runs.
          $resolved = (Get-Command npm).Source
          if ($resolved -ne "$shims\npm.cmd") { throw "npm resolves to $resolved, not the shim" }

      - name: Test NPM - Through the Shim
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "npm-test") -Force)
          npm init -y
          npm install express@5.2.1
          npm install lodash@4.17.21
          if (-not (Test-Path node_modules\express)) { throw "express not installed" }
          if (-not (Test-Path node_modules\lodash)) { throw "lodash not installed" }
          if (-not (Select-String -Quiet '"express"' package.json)) { throw "express missing from package.json" }

          Write-Host "Testing manifest installation through the shim..."
          Remove-Item -Recurse -Force node_modules, package-lock.json
          npm install
          if (-not (Test-Path package-lock.json)) { throw "package-lock.json not written" }
          if (-not (Test-Path node_modules\express)) { throw "express not installed from the manifest" }

          Write-Host "Testing a scoped package through the shim..."
          npm install "@types/node@18.0.0"
          if (-not (Test-Path node_modules\@types\node)) { throw "@types/node not installed" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "npm-test"

      # A typed `pmg npm ...` has no shim in front of it and takes the direct
      # launch path. Both paths must work.
      - name: Test NPM - Direct pmg npm
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "npm-direct-test") -Force)
          pmg npm init -y
          pmg npm install express@5.2.1
          if (-not (Test-Path node_modules\express)) { throw "express not installed" }

          Write-Host "Testing dry-run creates no files..."
          Remove-Item -Recurse -Force node_modules, package-lock.json
          pmg --dry-run npm install
          if (Test-Path node_modules) { throw "dry-run created node_modules" }
          if (Test-Path package-lock.json) { throw "dry-run created package-lock.json" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "npm-direct-test"

      - name: Test safedep-test-pkg is Blocked through the Shim
        run: |
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "block-test") -Force)
          npm init -y
          # A non-zero exit alone is not enough. npm could fail for another
          # reason and falsely pass, so the block message is required.
          $output = npm --no-cache --prefer-online i safedep-test-pkg@0.1.3 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "safedep-test-pkg was not blocked" }
          if ($output -notmatch 'Malicious package blocked') { throw "npm failed, but not because PMG blocked the package" }
          if (Test-Path node_modules\safedep-test-pkg) { throw "safedep-test-pkg found in node_modules" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "block-test"
          # The step exits with the last native exit code, which the expected
          # failure left non-zero.
          exit 0

      # cmd.exe resolves the shim on its own rules and hands the batch file the
      # typed line as is, where pwsh rebuilds it. One install and one block
      # cover that shell end to end.
      - name: Test NPM through the Shim - cmd.exe
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\npm-cmd-test" && cd /d "%RUNNER_TEMP%\npm-cmd-test" || exit /b 1
          call npm init -y || exit /b 1
          call npm install express@5.2.1 || exit /b 1
          if not exist node_modules\express (echo express not installed & exit /b 1)
          cd /d "%RUNNER_TEMP%" && rmdir /s /q "npm-cmd-test"

      - name: Test safedep-test-pkg is Blocked through the Shim - cmd.exe
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\block-cmd-test" && cd /d "%RUNNER_TEMP%\block-cmd-test" || exit /b 1
          call npm init -y || exit /b 1
          call npm --no-cache --prefer-online i safedep-test-pkg@0.1.3 > output.txt 2>&1
          if not errorlevel 1 (echo safedep-test-pkg was not blocked & exit /b 1)
          type output.txt
          findstr /c:"Malicious package blocked" output.txt >nul || (echo npm failed, but not because PMG blocked the package & exit /b 1)
          if exist node_modules\safedep-test-pkg (echo safedep-test-pkg found in node_modules & exit /b 1)
          cd /d "%RUNNER_TEMP%" && rmdir /s /q "block-cmd-test"

      - name: Test PNPM - Single Package & Manifest
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "pnpm-test") -Force)
          # Not `pnpm init`: it writes devEngines.packageManager with
          # onFail:download, and the following `pnpm add` then fails.
          npm init -y
          pnpm add express@5.2.1
          pnpm add lodash@4.17.21
          if (-not (Test-Path node_modules\express)) { throw "express not installed" }
          if (-not (Test-Path pnpm-lock.yaml)) { throw "pnpm-lock.yaml not written" }

          Write-Host "Testing manifest installation..."
          Remove-Item -Recurse -Force node_modules, pnpm-lock.yaml
          pnpm install
          if (-not (Test-Path pnpm-lock.yaml)) { throw "pnpm-lock.yaml not written from the manifest" }
          if (-not (Test-Path node_modules\lodash)) { throw "lodash not installed from the manifest" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "pnpm-test"

      # Runs before the classic-yarn step so corepack's Berry shim stays the
      # `yarn` behind our shim. The later `npm install -g yarn@1.22.22` shadows it.
      - name: Test safedep-test-pkg is Blocked using Yarn (Berry)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          YARN_NODE_LINKER: node-modules
          YARN_ENABLE_HARDENED_MODE: "0"
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "yarn-berry-test") -Force)
          npm init -y
          npm pkg set packageManager=yarn@4.16.0
          yarn --version
          $output = yarn add safedep-test-pkg@0.1.3 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "safedep-test-pkg was not blocked with Yarn Berry" }
          if ($output -notmatch 'Malicious package blocked') { throw "yarn add failed, but not because PMG blocked the package" }
          if (Test-Path node_modules\safedep-test-pkg) { throw "safedep-test-pkg found in node_modules" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "yarn-berry-test"
          exit 0

      - name: Test Yarn - Single Package & Manifest
        env:
          YARN_ENABLE_HARDENED_MODE: "0"
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          # corepack's yarn.cmd lives in the node directory, and the npm
          # global prefix is a separate directory behind it on PATH, so a
          # global install cannot shadow it here the way it does on Linux.
          corepack disable
          npm install -g yarn@1.22.22
          # Into RUNNER_TEMP before the first yarn call: the checkout's
          # package.json pins pnpm, and yarn refuses to run in that project.
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "yarn-test") -Force)
          yarn --version
          yarn init -y
          yarn add express@5.2.1
          yarn add lodash@4.17.21
          if (-not (Test-Path node_modules\express)) { throw "express not installed" }
          if (-not (Test-Path yarn.lock)) { throw "yarn.lock not written" }

          Write-Host "Testing manifest installation..."
          Remove-Item -Recurse -Force node_modules, yarn.lock
          yarn install
          if (-not (Test-Path yarn.lock)) { throw "yarn.lock not written from the manifest" }
          if (-not (Test-Path node_modules\lodash)) { throw "lodash not installed from the manifest" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "yarn-test"

      - name: Test NPX - Package Execution
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "npx-test") -Force)
          $output = npx cowsay@1.6.0 "Hello from pmg npx" | Out-String
          Write-Host $output
          if ($output -notmatch 'Hello from pmg npx') { throw "npx output missing the message" }

          $output = npx --package cowsay@1.6.0 -- cowsay "Hello with package flag" | Out-String
          if ($output -notmatch 'Hello with package flag') { throw "npx --package output missing the message" }

          Write-Host "Testing dry-run does not run the package..."
          $output = pmg --dry-run npx cowsay@1.6.0 "This should not execute" | Out-String
          if ($output -match '\^__\^') { throw "dry-run executed cowsay" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "npx-test"

      - name: Test PNPX - Package Execution
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "pnpx-test") -Force)
          $output = pnpx cowsay@1.6.0 "Hello from pmg pnpx" | Out-String
          Write-Host $output
          if ($output -notmatch 'Hello from pmg pnpx') { throw "pnpx output missing the message" }

          $output = pmg --dry-run pnpx cowsay@1.6.0 "This should not execute" | Out-String
          if ($output -match '\^__\^') { throw "dry-run executed cowsay" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "pnpx-test"

      # A venv puts its own pip.exe ahead of the shims, so pip runs as `pmg pip`
      # here, as it does on Linux and macOS.
      - name: Test Pip and Pip3 - Single Package & Manifest
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "pip-test") -Force)
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          pmg pip install requests==2.32.4
          pmg pip install numpy==2.3.5
          python -c "import requests, numpy; print('pip ok:', requests.__version__, numpy.__version__)"

          Write-Host "Testing manifest installation..."
          pmg pip freeze | Where-Object { $_ -notmatch '^PMG:' } | Set-Content requirements.txt
          if (-not (Select-String -Quiet '^requests==' requirements.txt)) { throw "requests missing from requirements.txt" }
          pmg pip uninstall -y requests numpy
          pmg pip install -r requirements.txt
          python -c "import requests, numpy; print('pip manifest ok:', requests.__version__, numpy.__version__)"
          deactivate

          Write-Host "Testing pip3 in its own venv..."
          python -m venv venv3
          .\venv3\Scripts\Activate.ps1
          pmg pip3 install requests==2.32.4
          python -c "import requests; print('pip3 ok:', requests.__version__)"
          deactivate
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "pip-test"

      - name: Test UV - Single Package & Manifest
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "uv-test") -Force)
          uv init --no-readme
          uv add requests==2.32.4
          uv add numpy==2.3.5
          if (-not (Select-String -Quiet 'requests' pyproject.toml)) { throw "requests missing from pyproject.toml" }

          Write-Host "Testing manifest installation..."
          Remove-Item -Recurse -Force .venv, uv.lock
          uv sync
          if (-not (Test-Path uv.lock)) { throw "uv.lock not written" }
          uv pip show requests | Out-Null
          uv pip show numpy | Out-Null

          Write-Host "Testing uv pip from requirements..."
          uv pip freeze | Where-Object { $_ -notmatch '^PMG:' } | Set-Content requirements.txt
          uv pip install -r requirements.txt
          uv pip show requests | Out-Null
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "uv-test"

      - name: Test UVX - Package Execution
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "uvx-test") -Force)
          $output = uvx ruff@0.6.9 --version | Out-String
          if ($output -notmatch '0\.6\.9') { throw "uvx did not run the pinned ruff" }

          $output = uvx --from cowsay cowsay -t "Hello from pmg uvx" | Out-String
          if ($output -notmatch 'Hello from pmg uvx') { throw "uvx --from output missing the message" }

          $output = pmg --dry-run uvx --from cowsay cowsay -t "This should not execute" | Out-String
          if ($output -match '\^__\^') { throw "dry-run executed cowsay" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "uvx-test"

      # bun is a native .exe, so it takes PMG's direct launch path rather than
      # the cmd.exe contract every .cmd manager uses. Nothing else in this job
      # covers that branch.
      - name: Test Bun - Single Package & Manifest
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "bun-test") -Force)
          bun init -y
          bun add express@5.2.1
          bun add lodash@4.17.21
          if (-not (Test-Path node_modules\express)) { throw "express not installed" }
          if (-not (Test-Path bun.lock)) { throw "bun.lock not written" }

          Write-Host "Testing manifest installation..."
          Remove-Item -Recurse -Force node_modules, bun.lock
          bun install
          if (-not (Test-Path bun.lock)) { throw "bun.lock not written from the manifest" }
          if (-not (Test-Path node_modules\lodash)) { throw "lodash not installed from the manifest" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "bun-test"

      - name: Test Poetry - Single Package & Manifest
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "poetry-test") -Force)
          poetry init --name poetry-test --no-interaction --quiet
          poetry add requests==2.32.4
          if (-not (Select-String -Quiet 'requests' pyproject.toml)) { throw "requests missing from pyproject.toml" }

          Write-Host "Testing manifest installation..."
          Remove-Item -Recurse -Force poetry.lock
          poetry install --no-root
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "poetry-test"

      - name: Test PMG Modes
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "pmg-modes-test") -Force)
          pmg npm init -y
          pmg --dry-run npm install express
          if (Test-Path node_modules) { throw "dry-run created node_modules" }

          pmg --silent npm install express
          if (-not (Test-Path node_modules\express)) { throw "--silent did not install" }

          Remove-Item -Recurse -Force node_modules, package-lock.json
          pmg --verbose npm install express
          if (-not (Test-Path node_modules\express)) { throw "--verbose did not install" }

          Remove-Item -Recurse -Force node_modules, package-lock.json
          pmg --debug --log debug.json npm install express
          if (-not (Test-Path debug.json)) { throw "--log wrote no file" }
          Set-Location $env:RUNNER_TEMP; Remove-Item -Recurse -Force "pmg-modes-test"

      # The spec names both shells. Doctor must pass in each on a configured
      # machine. Warnings are allowed, a failed check is not: doctor exits
      # non-zero on a Fail, which stops the pwsh step through
      # $PSNativeCommandUseErrorActionPreference and the cmd step through
      # cmd's own default.
      - name: Test PMG Doctor - PowerShell
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          pmg setup doctor

      - name: Test PMG Doctor - cmd.exe
        shell: cmd
        run: pmg setup doctor

      - name: Test PMG Remove
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          pmg setup remove
          $shims = "$env:LOCALAPPDATA\safedep\pmg\bin"
          if (Test-Path $shims) { throw "shim directory still exists" }
          $userPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path
          if ($userPath -and ($userPath -split ';' | Where-Object { $_ -ieq $shims })) { throw "shim directory still on the user PATH: $userPath" }

  # The machine-wide install, on the real paths. The runner is elevated, and
  # its image ships Node from the MSI under Program Files on the machine PATH,
  # which is the case the system install exists for. Steps that must see the
  # PATH a new process gets build it from the registry, because GITHUB_PATH
  # prepends to the job PATH and would hide the ordering under test.
  e2e-windows-system:
    name: PMG E2E Tests - Windows System Install
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PMG_PRODUCT: C:\Program Files\safedep\pmg
      PMG_CONFIG: C:\ProgramData\safedep\pmg\config.yml
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the image ships Node on the machine PATH
        run: |
          $ErrorActionPreference = 'Stop'
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          Write-Host "machine PATH: $machine"
          if (-not (Test-Path "$env:ProgramFiles\nodejs\npm.cmd")) { throw "npm.cmd is not under Program Files\nodejs" }
          if (($machine -split ';' | Where-Object { $_ -ieq "$env:ProgramFiles\nodejs\" -or $_ -ieq "$env:ProgramFiles\nodejs" }).Count -eq 0) {
            throw "Program Files\nodejs is not on the machine PATH, so this job does not test the MSI case"
          }

      - name: Build PMG
        run: go build -o bin\pmg.exe .

      - name: Reject a binary outside the product directory
        run: |
          $output = & bin\pmg.exe setup install --system 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "a binary outside Program Files was accepted" }
          if ($output -notmatch 'is not at C:\\Program Files\\safedep\\pmg\\pmg.exe') { throw "the error does not name the required path" }
          if (Test-Path "$env:PMG_PRODUCT\bin") { throw "shims were written for a rejected binary" }
          exit 0

      - name: Place the binary under Program Files
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force $env:PMG_PRODUCT | Out-Null
          Copy-Item bin\pmg.exe "$env:PMG_PRODUCT\pmg.exe"

      # The file carries the descriptor ProgramData hands out, not PMG's, which
      # is what a file a user dropped in looks like. The install writes the
      # shims and the PATH first, so both are in place afterwards, and the
      # rejected file stays for inspection.
      - name: Reject a pre-existing config that PMG did not write
        run: |
          New-Item -ItemType Directory -Force (Split-Path $env:PMG_CONFIG) | Out-Null
          Set-Content -Path $env:PMG_CONFIG -Value "paranoid: false"
          $output = & "$env:PMG_PRODUCT\pmg.exe" setup install --system 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "a config PMG did not write was accepted" }
          if ($output -notmatch 'does not carry the PMG security descriptor') { throw "the error does not say why the file is rejected" }
          if ((Get-Content $env:PMG_CONFIG -Raw) -notmatch 'paranoid: false') { throw "the rejected file was changed" }
          Remove-Item $env:PMG_CONFIG
          exit 0

      - name: Install system-wide
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          & "$env:PMG_PRODUCT\pmg.exe" setup install --system

      - name: Verify the machine PATH
        run: |
          $ErrorActionPreference = 'Stop'
          $key = Get-Item 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          if ($key.GetValueKind('Path') -ne 'ExpandString') { throw "the machine PATH is $($key.GetValueKind('Path')), not REG_EXPAND_SZ" }
          $entries = $key.GetValue('Path', $null, 'DoNotExpandEnvironmentNames') -split ';' | Where-Object { $_ }
          Write-Host ($entries -join "`n")
          if ($entries[0] -ine "$env:PMG_PRODUCT\bin") { throw "the shim directory is not the first machine PATH entry: $($entries[0])" }
          if (($entries | Where-Object { $_ -ieq $env:PMG_PRODUCT }).Count -ne 1) { throw "the product directory is not on the machine PATH exactly once" }

      - name: Verify every object carries the PMG descriptor
        run: |
          $ErrorActionPreference = 'Stop'
          $shims = Get-ChildItem "$env:PMG_PRODUCT\bin" -Filter *.cmd | ForEach-Object { $_.FullName }
          if ($shims.Count -lt 10) { throw "only $($shims.Count) shims were written" }
          $objects = @("C:\Program Files\safedep", $env:PMG_PRODUCT, "$env:PMG_PRODUCT\bin", "$env:PMG_PRODUCT\pmg.exe", "C:\ProgramData\safedep", (Split-Path $env:PMG_CONFIG), $env:PMG_CONFIG) + $shims
          foreach ($object in $objects) {
            $acl = Get-Acl $object
            if ($acl.Owner -ne 'BUILTIN\Administrators') { throw "$object is owned by $($acl.Owner)" }
            if (-not $acl.AreAccessRulesProtected) { throw "$object inherits its DACL" }
            $rules = $acl.Access
            if ($rules.Count -ne 3) { throw "$object has $($rules.Count) entries, not 3" }
            foreach ($rule in $rules) {
              if ($rule.AccessControlType -ne 'Allow') { throw "$object has a deny entry for $($rule.IdentityReference)" }
            }
            $users = $rules | Where-Object { $_.IdentityReference -eq 'BUILTIN\Users' }
            if (-not $users) { throw "$object has no Users entry" }
            if ($users.FileSystemRights -ne 'ReadAndExecute, Synchronize') { throw "$object gives Users $($users.FileSystemRights)" }
            foreach ($admin in 'BUILTIN\Administrators', 'NT AUTHORITY\SYSTEM') {
              $entry = $rules | Where-Object { $_.IdentityReference -eq $admin }
              if (-not $entry -or $entry.FileSystemRights -ne 'FullControl') { throw "$object does not give $admin full control" }
            }
            Write-Host "ok  $object"
          }

      # A new process gets the machine PATH, then the user PATH. That PATH,
      # not the job's, decides what a typed `npm` runs.
      - name: Resolve npm and pmg through the registry PATH
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = [Environment]::ExpandEnvironmentVariables([Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User'))
          $npm = (Get-Command npm).Source
          $pmg = (Get-Command pmg).Source
          Write-Host "npm -> $npm"
          Write-Host "pmg -> $pmg"
          if ($npm -ine "$env:PMG_PRODUCT\bin\npm.cmd") { throw "npm resolves to $npm, not to the system shim" }
          if ($pmg -ine "$env:PMG_PRODUCT\pmg.exe") { throw "pmg resolves to $pmg, not to the system binary" }

      - name: Install a package through the system shim
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          $env:Path = [Environment]::ExpandEnvironmentVariables([Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User'))
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "system-npm-test") -Force)
          npm init -y
          npm install express@5.2.1
          if (-not (Test-Path node_modules\express)) { throw "express not installed" }

      - name: Block a package through the system shim
        run: |
          $env:Path = [Environment]::ExpandEnvironmentVariables([Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User'))
          Set-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "system-block-test") -Force)
          npm init -y
          $output = npm --no-cache --prefer-online i safedep-test-pkg@0.1.3 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "safedep-test-pkg was not blocked" }
          if ($output -notmatch 'Malicious package blocked') { throw "npm failed, but not because PMG blocked the package" }
          if (Test-Path node_modules\safedep-test-pkg) { throw "safedep-test-pkg found in node_modules" }
          exit 0

      # The shims exist for every account. A standard user with a fresh
      # logon gets the machine PATH, so a bare npm runs through PMG and the
      # block holds, with no per-user install on that account.
      - name: Block a package as a standard user
        run: |
          $ErrorActionPreference = 'Stop'
          # Fourteen characters at most: for a longer one `net user` asks a
          # yes/no question, and with no console to answer it, it creates
          # nothing and exits zero.
          $password = 'Pmg!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          $created = net user pmgtest $password /add 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $created -notmatch 'completed successfully') { throw "net user did not create the account: $created" }
          $workDir = 'C:\Users\Public\pmg-standard-user'
          New-Item -ItemType Directory -Force $workDir | Out-Null
          icacls $workDir /grant 'BUILTIN\Users:(OI)(CI)F' | Out-Null

          # Start-Process -Credential hands the child the caller's environment,
          # which predates the install. -UseNewEnvironment builds PATH from the
          # registry as a logon does, but sets no profile variables, so the
          # batch file sets the ones npm and PMG need. The two `where` lines
          # say what the logon resolved when the assertion fails.
          $batch = @"
          @echo off
          set "USERPROFILE=C:\Users\pmgtest"
          set "APPDATA=%USERPROFILE%\AppData\Roaming"
          set "LOCALAPPDATA=%USERPROFILE%\AppData\Local"
          set "TEMP=%LOCALAPPDATA%\Temp"
          set "TMP=%TEMP%"
          if not exist "%TEMP%" mkdir "%TEMP%"
          where npm
          where pmg
          call npm --no-cache --prefer-online i safedep-test-pkg@0.1.3
          exit /b %ERRORLEVEL%
          "@
          Set-Content -Path "$workDir\block.cmd" -Value (($batch -split "`n" | ForEach-Object { $_.Trim() }) -join "`r`n")

          $credential = New-Object System.Management.Automation.PSCredential('pmgtest', (ConvertTo-SecureString $password -AsPlainText -Force))
          $process = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList '/d', '/c', "$workDir\block.cmd" `
            -WorkingDirectory $workDir -Credential $credential -LoadUserProfile -UseNewEnvironment -Wait -PassThru `
            -RedirectStandardOutput "$workDir\block.out" -RedirectStandardError "$workDir\block.err"
          $output = (Get-Content "$workDir\block.out" -Raw) + (Get-Content "$workDir\block.err" -Raw -ErrorAction SilentlyContinue)
          Write-Host $output
          if ($process.ExitCode -eq 0) { throw "safedep-test-pkg was not blocked for the standard user" }
          if ($output -notmatch 'Malicious package blocked') { throw "npm failed for the standard user, but not because PMG blocked the package" }

      - name: Doctor passes on a clean system install
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          & "$env:PMG_PRODUCT\pmg.exe" setup doctor

      - name: Doctor reports a drifted shim, and a reinstall repairs it
        run: |
          icacls "$env:PMG_PRODUCT\bin\npm.cmd" /grant 'BUILTIN\Users:(W)' | Out-Null
          $output = & "$env:PMG_PRODUCT\pmg.exe" setup doctor 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "doctor passed with a user-writable shim" }
          if ($output -notmatch 'System install unsafe') { throw "doctor failed, but not on the shim descriptor" }

          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          & "$env:PMG_PRODUCT\pmg.exe" setup install --system
          & "$env:PMG_PRODUCT\pmg.exe" setup doctor
          $users = (Get-Acl "$env:PMG_PRODUCT\bin\npm.cmd").Access | Where-Object { $_.IdentityReference -eq 'BUILTIN\Users' }
          if ($users.FileSystemRights -ne 'ReadAndExecute, Synchronize') { throw "the reinstall left Users with $($users.FileSystemRights)" }

      # A tampered shim may have lost the marker that identifies it. Doctor
      # checks the expected shims by name, so it still reports the tampering.
      - name: Doctor reports a tampered shim, and a reinstall replaces it
        run: |
          Set-Content -Path "$env:PMG_PRODUCT\bin\npm.cmd" -Value "@echo off`r`necho tampered"
          icacls "$env:PMG_PRODUCT\bin\npm.cmd" /grant 'BUILTIN\Users:(W)' | Out-Null
          $output = & "$env:PMG_PRODUCT\pmg.exe" setup doctor 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "doctor passed with a tampered shim" }
          if ($output -notmatch 'npm\.cmd') { throw "doctor failed, but did not name the tampered shim" }

          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          & "$env:PMG_PRODUCT\pmg.exe" setup install --system
          & "$env:PMG_PRODUCT\pmg.exe" setup doctor
          if ((Get-Content "$env:PMG_PRODUCT\bin\npm.cmd" -Raw) -notmatch 'PMG_RAW_ARGS') { throw "the reinstall did not replace the tampered shim" }

      # A managed config whose permissions were loosened is not PMG's file any
      # more. Doctor reports it, the runtime ignores it, and the install
      # refuses to merge it until an administrator deletes it.
      - name: A loosened managed config is reported, ignored and refused
        run: |
          icacls $env:PMG_CONFIG /grant 'BUILTIN\Users:(W)' | Out-Null
          $output = & "$env:PMG_PRODUCT\pmg.exe" setup doctor 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "doctor passed with a user-writable managed config" }
          if ($output -notmatch 'config\.yml') { throw "doctor failed, but did not name the config" }

          $output = & "$env:PMG_PRODUCT\pmg.exe" setup install --system 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw "the install merged a user-writable managed config" }
          if ($output -notmatch 'does not carry the PMG security descriptor') { throw "the install failed, but not on the config" }

          Remove-Item $env:PMG_CONFIG
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          & "$env:PMG_PRODUCT\pmg.exe" setup install --system
          & "$env:PMG_PRODUCT\pmg.exe" setup doctor

      - name: A second install leaves the machine PATH as it is
        run: |
          $ErrorActionPreference = 'Stop'
          $key = Get-Item 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $entries = $key.GetValue('Path', $null, 'DoNotExpandEnvironmentNames') -split ';' | Where-Object { $_ }
          if (($entries | Where-Object { $_ -ieq "$env:PMG_PRODUCT\bin" }).Count -ne 1) { throw "the shim directory is not on the machine PATH exactly once" }
          if ($entries[0] -ine "$env:PMG_PRODUCT\bin") { throw "the shim directory is no longer first" }

      - name: Remove the system install
        run: |
          $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true
          & "$env:PMG_PRODUCT\pmg.exe" setup remove --system
          if (Test-Path "$env:PMG_PRODUCT\bin") { throw "the shim directory still exists" }
          if (-not (Test-Path $env:PMG_CONFIG)) { throw "remove without --config-file deleted the managed config" }
          $key = Get-Item 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $entries = $key.GetValue('Path', $null, 'DoNotExpandEnvironmentNames') -split ';' | Where-Object { $_ }
          if ($entries | Where-Object { $_ -ieq "$env:PMG_PRODUCT\bin" }) { throw "the shim directory is still on the machine PATH" }
          if (-not ($entries | Where-Object { $_ -ieq $env:PMG_PRODUCT })) { throw "the product directory left the machine PATH, so a typed pmg would stop working" }

          & "$env:PMG_PRODUCT\pmg.exe" setup remove --system --config-file
          if (Test-Path $env:PMG_CONFIG) { throw "the managed config still exists" }
