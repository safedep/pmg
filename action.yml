name: Setup PMG
description: Install Package Manager Guard (PMG) and wrap npm/pip/etc. in this Linux GitHub Actions runner. In server mode the action stops PMG at the end of the job and writes a job summary.
author: SafeDep
branding:
  icon: shield
  color: green

inputs:
  version:
    description: PMG release tag to install (e.g. v0.42.0) or "latest".
    required: false
    default: latest

  api-key:
    description: SafeDep Cloud API key. When set together with tenant-id, cloud sync is enabled and credentials are passed via env (no keychain needed in CI).
    required: false
    default: ""
  tenant-id:
    description: SafeDep Cloud tenant ID. Required when api-key is set.
    required: false
    default: ""
  endpoint-id:
    description: Identifier reported to SafeDep Cloud for this runner. When empty and cloud is enabled, defaults to "gha/<owner>/<repo>" so events aggregate per repository instead of per ephemeral runner hostname.
    required: false
    default: ""

  paranoid:
    description: Treat suspicious packages as malicious (PMG_PARANOID). Empty = use PMG default (false).
    required: false
    default: ""
  cooldown-enabled:
    description: Block recently-published package versions (PMG_DEPENDENCY_COOLDOWN_ENABLED). Empty = use PMG default (true).
    required: false
    default: ""
  cooldown-days:
    description: Cooldown window in days (PMG_DEPENDENCY_COOLDOWN_DAYS). Empty = use PMG default (2).
    required: false
    default: ""
  proxy-mode:
    description: REMOVED. PMG always uses proxy-based interception. Setting "false" fails the action; any other value is ignored with a warning.
    required: false
    default: ""

  sandbox:
    description: Run package managers inside an OS sandbox (PMG_SANDBOX_ENABLED). Empty = use PMG default (false). Enabling will also relax AppArmor user-namespace restrictions on the runner so unprivileged user namespaces work.
    required: false
    default: ""
  sandbox-driver:
    description: Sandbox backend on Linux (PMG_SANDBOX_DRIVER). One of "landlock" or "bubblewrap". Defaults to "landlock" when sandbox is enabled and this is empty.
    required: false
    default: ""

  verbosity:
    description: PMG output verbosity (PMG_VERBOSITY). One of "silent", "normal", "verbose". Empty = use PMG default.
    required: false
    default: ""
  disable-telemetry:
    description: Disable anonymous PMG telemetry (PMG_DISABLE_TELEMETRY). Empty = use PMG default.
    required: false
    default: ""
  skip-event-logging:
    description: Skip writing audit events to the local event log (PMG_SKIP_EVENT_LOGGING). Empty = use PMG default.
    required: false
    default: ""

  config-file:
    description: Path (relative to the workspace) to a user-supplied PMG config.yml. Copied into the PMG config directory before "pmg setup install" runs, so PMG merges any missing template keys into it.
    required: false
    default: ""

  cache:
    description: Reuse a previously-installed PMG binary from $RUNNER_TOOL_CACHE/pmg/<version>/<arch>. Off by default; fresh download per run keeps the binary current and reduces the blast radius of any cached artifact tampering. Checksum verification still runs on every install path.
    required: false
    default: "false"

  server-mode:
    description: Run PMG as a persistent proxy server instead of shims. The proxy is started as a daemon and HTTP_PROXY/cert env vars are exported to the job, with PMG_PROXY_RUN, the id of the run in the event log. The post step of the action stops the proxy at the end of the job. Empty means server mode, except with sandbox true, which needs the shims. Set false for shims. network-profile turns server mode on.
    required: false
    default: ""
  fail-on-violation:
    description: With server mode, fail the job at its end when PMG blocked a package or the network policy denied a connection, or when PMG cannot verify the final proxy state. When PMG cannot stop the proxy, the job fails with every setting.
    required: false
    default: "true"
  auto-stop:
    description: With server mode, stop the proxy in the post step of the action at the end of the job. Set it to false only when a workflow step stops the proxy and needs its output.
    required: false
    default: "true"
  baseline:
    description: With server mode, propose a network profile from the destinations the job reached, and show it in the job summary with each destination host. On a public repository anyone can read the summary. A denied connection shows in the summary also when baseline is false.
    required: false
    default: "true"
  expose-to-job-network:
    description: With server-mode in a job that has a job container, bind the proxy to the job container's address on the job network instead of 127.0.0.1. Docker container actions and docker:// steps in the same job can then reach the proxy. Every container on the job network can reach the proxy. Fails when the job has no job container.
    required: false
    default: "false"

  enforce:
    description: With server mode, make the Linux kernel route every eligible process through the proxy, so a step cannot bypass it by dropping the proxy environment. auto enforces where the runner can, which needs the runner host and passwordless sudo, and runs the proxy without enforcement elsewhere. true fails where the runner cannot enforce. false turns it off. The action installs the PMG CA into the system trust store, starts the daemon as root, and sets NODE_EXTRA_CA_CERTS for Node before 22.19 unless the job sets it. The action exports PMG_BIN and PMG_PROXY_STATE, so a step can run "sudo $PMG_BIN proxy stop --state $PMG_PROXY_STATE". With config-file it also exports PMG_PROXY_CONFIG_DIR, the daemon's config directory.
    required: false
    default: "auto"
  enforce-ports:
    description: With enforce, destination ports to route in addition to proxy.server.enforce.ports (comma or newline separated). Passed as --enforce-port.
    required: false
    default: ""
  enforce-exempt-users:
    description: With enforce, users never routed, in addition to proxy.server.enforce.exempt_users (comma or newline separated). Passed as --enforce-exempt-user.
    required: false
    default: ""
  enforce-exempt-executables:
    description: With enforce, absolute paths or globs of programs that connect directly, in addition to proxy.server.enforce.exempt_executables (comma or newline separated). Passed as --enforce-exempt-executable.
    required: false
    default: ""
  enforce-skip-destinations:
    description: With enforce, CIDR prefixes the kernel never routes, in addition to proxy.server.enforce.skip_destinations (comma or newline separated). Passed as --enforce-skip-destination.
    required: false
    default: ""
  enforce-namespaces:
    description: With enforce, what happens to containers that steps start, such as docker run and docker build. ignore leaves them alone. redirect sends them through the proxy and fails the job when the runner cannot. auto redirects where the runner can. A container must trust the PMG CA, see PMG_CA_BUNDLE in docs/persistent-proxy.md. Passed as --enforce-namespaces.
    required: false
    default: ""
  network-profile:
    description: The sandbox profile whose network rules the proxy applies, as a path in the workspace or a built-in name. Passed as --profile. Turns server mode on. When the path does not exist and network-mode is not enforce, the proxy starts with no profile and the job summary proposes one for that path. See docs/github-action.md.
    required: false
    default: ""
  network-mode:
    description: With network-profile, what the proxy does with a match on a deny rule, audit or enforce. Passed as --network-mode. Empty means audit.
    required: false
    default: ""

runs:
  # A JavaScript action, so that the post step stops the proxy at the end of
  # the job. A composite action has no post step. main.js and post.js use
  # Node built-ins only and run the shell scripts in action/. The scripts
  # run with sh, because minimal job container images such as Alpine have no
  # bash. enforce.sh uses bash, and runs only on the runner host.
  using: node24
  main: action/main.js
  post: action/post.js
  post-if: always()

outputs:
  version:
    description: The resolved PMG version that was installed.
  bin-dir:
    description: Directory containing the pmg binary on this runner.
