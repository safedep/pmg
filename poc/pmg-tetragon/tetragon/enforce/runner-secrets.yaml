# Secrets live decrypted in the memory of Runner.Worker. The
# tj-actions/changed-files compromise read them through /proc/<pid>/mem.
#
# security_ptrace_access_check runs when one process opens another process's
# /proc/<pid>/mem or attaches with ptrace (mode PTRACE_MODE_ATTACH, bit 0x2).
# The kernel skips it when a process reads its own memory, so it does not
# match tools such as PMG that open /proc/self/mem.
#
# security_file_open reports opens of /proc/*/mem and of credential files that
# a malicious install script looks for. It never kills: git and npm read
# their own credential files.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "runner-secrets"
spec:
  kprobes:
  - call: "security_ptrace_access_check"
    syscall: false
    args:
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Mask"
        values:
        - "2"
      matchActions:
      - action: Sigkill
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/proc/"
      - index: 0
        operator: "Postfix"
        values:
        - "/mem"
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/.npmrc"
        - "/.pypirc"
        - "/.git-credentials"
        - "/.aws/credentials"
        - "/.docker/config.json"
        - "/.ssh/id_rsa"
        - "/.ssh/id_ed25519"
