# Secrets live decrypted in the memory of Runner.Worker. A read of
# /proc/<pid>/mem is how the tj-actions/changed-files compromise took them.
# The second selector reports reads of credential files that a malicious
# install script looks for.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "runner-secrets"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/proc/"
      - index: 0
        operator: "Postfix"
        values:
        - "/mem"
      matchActions:
      - action: Sigkill
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/.npmrc"
        - "/.pypirc"
        - "/.git-credentials"
        - "/.aws/credentials"
        - "/.docker/config.json"
        - "/.ssh/id_rsa"
        - "/.ssh/id_ed25519"
  - call: "sys_ptrace"
    syscall: true
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "int"
