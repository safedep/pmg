schema_version: 1
kind: preset
name: asdf
description: asdf version manager tool installs (asdf install, asdf reshim)

metadata:
  author: SafeDep
  labels: [asdf, version-manager, toolchain]

# Threat notes:
# - All writes stay under ${HOME}/.asdf, asdf's default data dir. installs/
#   holds built versions; downloads/ and tmp/ are build staging; shims/ is
#   regenerated by asdf reshim.
# - Plugin management (asdf plugin add) is left out on purpose: it writes
#   plugins/ and plugin-index/, git clones of network repos with executable
#   scripts, so it needs an explicit allowance rather than every install run.
# - Downloads need network; the schema forbids preset outbound rules, so
#   under network_via_proxy_only asdf must honor HTTP_PROXY/HTTPS_PROXY.
filesystem:
  allow_read:
    - ${HOME}/.asdfrc
    - ${HOME}/.tool-versions
    - ${HOME}/.asdf/**

  allow_write:
    - ${HOME}/.asdf/installs/**
    - ${HOME}/.asdf/downloads/**
    - ${HOME}/.asdf/shims/**
    - ${HOME}/.asdf/tmp/**
