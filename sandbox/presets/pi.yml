schema_version: 1
kind: preset
name: pi
description: Pi coding agent state and credentials for `pmg sandbox exec -- pi`

metadata:
  author: SafeDep
  labels: [agent, pi-agent]

# Threat notes:
# - allow_write on ~/.pi/** covers agent settings, auth and sessions. The
#   extension directory ~/.pi/agent/extensions stays blocked: the exec
#   profile denies it and deny wins over a preset allow.
# - Pi talks to several model providers, so it re-allows the three common
#   provider keys. Copy this preset and keep one key to narrow it. See
#   docs/sandbox-exec.md for the trade-off.
filesystem:
  allow_write:
    - ${HOME}/.pi/**

environment:
  allow:
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - GEMINI_API_KEY

# Network notes. Pi documents no host list, so the hosts come from its
# source (github.com/badlogic/pi-mono, packages/ai/src).
# - The three API hosts match the three keys above. Their base URLs are in
#   providers/anthropic.ts, providers/openai.ts and providers/google.ts.
# - claude.ai and platform.claude.com serve the Claude Pro/Max sign-in
#   (auth/oauth/anthropic.ts). auth.openai.com serves the ChatGPT sign-in
#   and chatgpt.com its model requests (auth/oauth/openai-codex.ts and
#   providers/openai-codex.ts).
# - pi.dev serves the version check on start (coding-agent, utils/
#   version-check.ts), the model catalog refresh (core/remote-catalog-
#   provider.ts) and the install report (modes/interactive/interactive-
#   mode.ts). Set PI_OFFLINE=1 to stop all three and drop the host.
# - Pi has many more providers. Copy this preset and add the host of the
#   one you use, or add it for a run with --sandbox-allow
#   net-connect=<host>:443.
network:
  allow_outbound:
    - api.anthropic.com:443
    - api.openai.com:443
    - generativelanguage.googleapis.com:443
    - claude.ai:443
    - platform.claude.com:443
    - auth.openai.com:443
    - chatgpt.com:443
    - pi.dev:443
