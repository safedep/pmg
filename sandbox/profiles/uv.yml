name: uv
description: Profile for uv, extending pypi-restrictive with uv environment variables
inherits: pypi-restrictive

package_managers:
  - uv

environment:
  # The pypi-restrictive base allows no environment variables. uv needs its
  # own config namespace and honors pip env conventions via the uv pip
  # interface. Sibling tool credentials (POETRY_*) and TWINE_* stay scrubbed.
  #
  # Accepted trade-off: UV_* re-allows UV_PUBLISH_TOKEN, uv's own publishing
  # credential.
  allow:
    - UV_*
    - PIP_*

filesystem:
  allow_read:
    - ${XDG_DATA_HOME}/uv/python/**

  allow_write:
    # uv sync and uv run download a managed Python into this directory when
    # the project needs a version that is not installed. uv uses this path
    # on macOS and Linux. Only the python subtree is listed. The rest of
    # ~/.local/share/uv holds installed tools, which uv tool install writes.
    # Accepted: uv later runs the Python that it keeps here, also outside the
    # sandbox, so a package can rewrite that Python.
    - ${XDG_DATA_HOME}/uv/python/**

network:
  # uv reads the list of managed Python builds from releases.astral.sh and
  # downloads the builds from GitHub release assets.
  allow_outbound:
    - releases.astral.sh:443
    - objects.githubusercontent.com:443
    - release-assets.githubusercontent.com:443
