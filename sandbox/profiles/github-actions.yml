name: github-actions
description: Network base for a PMG proxy on a GitHub Actions runner. Allows the hosts the runner and the GitHub actions reach.
# The persistent proxy serves every package manager of the job, so the
# profile names the exec workload, as the exec base does.
package_managers:
  - exec

# Network rules only. The proxy applies the network block of a profile, so
# filesystem rules here would only warn at daemon start. Used on its own,
# the profile allows the runner hosts and nothing else.
#
# Under enforce the runner itself goes through the proxy. It sends the job
# log and the results to GitHub, and the actions download tarballs and
# containers. A proposal from a run in GitHub Actions inherits this
# profile, so it does not list these hosts.
#
# The runner, actions/upload-artifact and actions/cache store job logs,
# artifacts and caches in the productionresultssa<N> Azure storage accounts.
# GitHub lists these 20 accounts for self-hosted runners. A wildcard on
# blob.core.windows.net would allow every Azure storage account, so a
# script could send data to an account it controls.
#
# *.githubapp.com is for the agents of a GitHub-hosted runner, such as
# hosted-compute-watchdog-prod-<region>.githubapp.com. The region changes
# from run to run, so a proposed exact host does not match the next run.
#
# A release download redirects to release-assets.githubusercontent.com.
# actions/setup-node and the other setup actions download from releases.
network:
  allow_outbound:
    - "*.actions.githubusercontent.com:443"
    - productionresultssa0.blob.core.windows.net:443
    - productionresultssa1.blob.core.windows.net:443
    - productionresultssa2.blob.core.windows.net:443
    - productionresultssa3.blob.core.windows.net:443
    - productionresultssa4.blob.core.windows.net:443
    - productionresultssa5.blob.core.windows.net:443
    - productionresultssa6.blob.core.windows.net:443
    - productionresultssa7.blob.core.windows.net:443
    - productionresultssa8.blob.core.windows.net:443
    - productionresultssa9.blob.core.windows.net:443
    - productionresultssa10.blob.core.windows.net:443
    - productionresultssa11.blob.core.windows.net:443
    - productionresultssa12.blob.core.windows.net:443
    - productionresultssa13.blob.core.windows.net:443
    - productionresultssa14.blob.core.windows.net:443
    - productionresultssa15.blob.core.windows.net:443
    - productionresultssa16.blob.core.windows.net:443
    - productionresultssa17.blob.core.windows.net:443
    - productionresultssa18.blob.core.windows.net:443
    - productionresultssa19.blob.core.windows.net:443
    - "*.githubapp.com:443"
    - github.com:443
    - api.github.com:443
    - codeload.github.com:443
    - objects.githubusercontent.com:443
    - release-assets.githubusercontent.com:443
    - ghcr.io:443
    - pkg-containers.githubusercontent.com:443
  # A host that no rule names is refused. A specific allow rule of a child
  # profile beats this rule.
  deny_outbound:
    - "*:*"
