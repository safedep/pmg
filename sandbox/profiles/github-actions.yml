name: github-actions
description: Network base for a PMG proxy on a GitHub Actions runner. Allows the hosts the runner and the GitHub actions reach.
# The persistent proxy serves every package manager of the job, so the
# profile names the exec workload, as the exec base does.
package_managers:
  - exec

# Network rules only. The proxy applies the network block of a profile, so
# filesystem rules here would only warn at daemon start. Used on its own,
# the profile allows the runner hosts and nothing else.
#
# Under enforce the runner itself goes through the proxy. It sends the job
# log and the results to GitHub, and the actions download tarballs and
# containers. A proposal from a run in GitHub Actions inherits this
# profile, so it does not list these hosts.
#
# The runner, actions/upload-artifact and actions/cache store job logs,
# artifacts and caches in Azure storage accounts. The productionresultssa
# hosts below are the ones in domains.actions_inbound.full_domains of
# https://api.github.com/meta. A wildcard would also match an Azure storage
# account that an attacker registers, so the profile names each account.
# When GitHub adds an account, add it here. The acceptance script
# proxy/network/github-actions-storage-accounts fails until then.
#
# *.githubapp.com is for the agents of a GitHub-hosted runner, such as
# hosted-compute-watchdog-prod-<region>.githubapp.com. The region changes
# from run to run, so a proposed exact host does not match the next run.
#
# A release download redirects to release-assets.githubusercontent.com.
# actions/setup-node and the other setup actions download from releases.
network:
  allow_outbound:
    - "*.actions.githubusercontent.com:443"
    - productionresultssa0.blob.core.windows.net:443
    - productionresultssa1.blob.core.windows.net:443
