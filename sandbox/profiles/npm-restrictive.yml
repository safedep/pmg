name: npm-restrictive
description: Restrictive sandbox policy for npm ecosystem (npm, pnpm, yarn, bun)
package_managers:
  - npm
  - pnpm
  - yarn
  - bun
  - npx
  - pnpx

# Optional security settings (uncomment to enable)
# allow_git_config: false  # Allow package managers to modify .git/config (default: false, blocks for security)

# Allow interactive terminal (PTY) operations
# Required for npx and pnpx to work, especially for commands like:
# npx create-next-app@latest
allow_pty: true

filesystem:
  allow_read:
    # Essential system paths for process execution
    - /
    - /usr/**
    - /var/**
    - /Library/**
    - /System/Library/**
    - /private/var/**
    # Project and user-specific paths
    - ${CWD}/**
    - ${HOME}/.npmrc
    - ${HOME}/.yarnrc
    - ${HOME}/.yarnrc.yml
    - ${HOME}/.bundle
    - ${HOME}/.npm/**
    - ${HOME}/.pnpm-store/**
    - ${XDG_CACHE_HOME}/pnpm/**
    - ${XDG_CACHE_HOME}/yarn/**
    - ${HOME}/.yarn/cache/**
    - ${HOME}/.bun/install/**
    - ${XDG_CACHE_HOME}/node-gyp/**
    - ${HOME}/Library/Caches/node-gyp/**

  allow_write:
    # Note: ${TMPDIR} is automatically allowed when write restrictions are enabled (macOS)
    # Note: Patterns ending with /** automatically allow creating the parent directory.
    #       For example, ${CWD}/node_modules/** allows both:
    #         1. Creating the node_modules directory itself
    #         2. Writing any files/directories inside it
    # Temporary directories for shell scripts and package managers
    # Note: On macOS, /tmp is a symlink to /private/tmp, so we need both
    - /tmp/**
    - /private/tmp/**
    - /var/tmp/**
    # The whole project directory is writable. Install output lands anywhere
    # in the project, and per-file enumeration does not scale. The mandatory
    # denies keep credential files and auto-exec directories blocked.
    - ${CWD}
    - ${CWD}/**
    # Package manager caches and stores
    - ${HOME}/.npm/**
    - ${HOME}/.pnpm-store/**
    - ${XDG_CACHE_HOME}/pnpm/**
    - ${XDG_CACHE_HOME}/yarn/**
    - ${HOME}/.yarn/cache/**
    - ${HOME}/.bun/install/**
    # node-gyp downloads the Node.js headers here when a package builds a
    # native addon. Without it, every install with a native module fails.
    # Accepted: the cache also holds common.gypi, which every later addon
    # build includes. A package can edit it, and a build outside the sandbox
    # then runs the actions that the package wrote.
    - ${XDG_CACHE_HOME}/node-gyp/**
    - ${HOME}/Library/Caches/node-gyp/**

  # Additional deny rules (optional - credentials are automatically blocked)
  # Automatically blocked for security:
  #   - .env, .env.*, .ssh/, .aws/, .gcloud/, .kube/, .gnupg/, .docker/config.json
  #   - .git/hooks/ (always blocked)
  #   - .git/config (blocked unless allow_git_config: true)
  deny_read: []

  deny_write:
    # Additional system directories to protect
    - /etc/**
    - /usr/**
    - /bin/**
    - /sbin/**
    # Additional deny rules for extra security
    - ${CWD}/.env
    - ${CWD}/.env.*

network:
  # The PMG proxy applies these rules by host. sandbox.network_mode sets
  # whether a match on the deny rule is recorded or refused.
  allow_outbound:
    - registry.npmjs.org:443
    - registry.yarnpkg.com:443
    - npm.pkg.github.com:443
    - github.com:443
    # npm and pnpm fetch a github: dependency as a tarball from codeload.
    - codeload.github.com:443
    # A GitHub release download redirects from github.com to these hosts.
    # Prebuilt native binaries come from release assets.
    - objects.githubusercontent.com:443
    - release-assets.githubusercontent.com:443
    # node-gyp downloads the Node.js headers for a native addon build.
    - nodejs.org:443

  deny_outbound:
    - "*:*"

environment:
  # This profile is the shared base for the npm ecosystem and deliberately
  # allows no environment variables: everything in the built-in
  # DANGEROUS_ENV_VARS list is scrubbed. Each package manager's leaf profile
  # (npm, yarn, bun, pnpm, npx) re-allows only the variables that
  # package manager needs for auth, registry config, and TLS.
  allow: []

process:
  allow_exec:
    - /usr/bin/node
    - /usr/local/bin/node
    - ${HOME}/.npm/**
    - ${HOME}/.pnpm-store/**
    - ${XDG_CACHE_HOME}/pnpm/**
    - ${XDG_CACHE_HOME}/yarn/**
    - ${HOME}/.yarn/cache/**
    - ${HOME}/.bun/install/**
    - ${HOME}/.asdf/shims/npm
    - ${HOME}/.asdf/shims/pnpm
    - ${HOME}/.asdf/shims/yarn
    - ${HOME}/.asdf/shims/bun
    - /usr/bin/git
    - /usr/local/bin/git
    - /bin/bash
    - /bin/sh
    - /usr/bin/env

  deny_exec:
    - /usr/bin/curl
    - /usr/bin/wget
    - /usr/bin/python*
