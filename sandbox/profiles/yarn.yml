name: yarn
description: Profile for yarn, extending npm-restrictive with yarn environment variables
inherits: npm-restrictive

package_managers:
  - yarn

environment:
  # Yarn berry authenticates via YARN_NPM_AUTH_*. Yarn classic reads .npmrc
  # with env interpolation and npm_config_* conventions, so the shared npm
  # auth set is also needed. Sibling tokens (BUN_AUTH_TOKEN) stay scrubbed.
  allow:
    - YARN_NPM_AUTH_TOKEN
    - YARN_NPM_AUTH_IDENT
    - NPM_TOKEN
    - NPM_AUTH_TOKEN
    - NODE_AUTH_TOKEN
    - npm_config_*
    - NPM_CONFIG_*
    - NODE_EXTRA_CA_CERTS

filesystem:
  allow_read:
    - ${HOME}/.yarn/berry/**
    - ${HOME}/Library/Caches/Yarn/**
    - ${XDG_CACHE_HOME}/node/corepack/**

  allow_write:
    # Yarn 2 and later keep the global cache in ~/.yarn/berry/cache
    # (enableGlobalCache is on by default in Yarn 4). The base profile only
    # covers the Yarn 1 cache under ~/.cache/yarn and ~/.yarn/cache.
    - ${HOME}/.yarn/berry/**

    # Yarn 1 keeps its cache in ~/Library/Caches/Yarn on macOS. Without it,
    # Yarn 1 falls back to a temporary cache on every install.
    - ${HOME}/Library/Caches/Yarn/**

    # Corepack downloads the Yarn version that package.json pins into
    # COREPACK_HOME, ~/.cache/node/corepack by default on macOS and Linux.
    # Accepted: corepack later runs the Yarn that it cached here, also
    # outside the sandbox, so a package can rewrite that Yarn. A
    # COREPACK_HOME elsewhere needs
    # pmg sandbox allow "write=$COREPACK_HOME/**".
    - ${XDG_CACHE_HOME}/node/corepack/**

network:
  # Yarn 2 and later download releases and official plugins from
  # repo.yarnpkg.com, for example yarn set version and yarn plugin import.
  allow_outbound:
    - repo.yarnpkg.com:443
